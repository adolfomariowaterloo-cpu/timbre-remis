<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Timbre Remis 🔔</title>
    
    <!-- Configuración PWA -->
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="logo.png">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* ESTILOS BASE Y RESET */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #000000;
            color: #ffffff;
            line-height: 1.5;
            overflow-x: hidden;
        }

        /* CONTENEDOR PRINCIPAL */
        .app-shell {
            max-width: 500px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: #000;
            position: relative;
        }

        /* HEADER */
        header {
            padding: 30px 20px;
            text-align: center;
            background: linear-gradient(to bottom, #1a1a1a, #000);
            border-bottom: 1px solid #333;
        }

        header img {
            width: 120px;
            height: auto;
            margin: 0 auto 15px;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.1));
        }

        header h1 {
            font-size: 28px;
            font-weight: 800;
            margin: 0;
            background: linear-gradient(45deg, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            padding: 20px;
            flex-grow: 1;
        }

        /* NUEVO PANEL DE PÁNICO TRIPLE */
        .panic-container {
            margin-bottom: 30px;
        }

        .panic-label {
            font-size: 12px;
            font-weight: bold;
            color: #ff4b2b;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 10px;
            display: block;
        }

        .panic-panel {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
        }

        .panic-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 18px 5px;
            border: none;
            border-radius: 20px;
            color: white;
            font-weight: 800;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .panic-btn:active { transform: scale(0.92); }

        .panic-medical { background: linear-gradient(135deg, #00c6ff, #0072ff); border-bottom: 4px solid #0056b3; }
        .panic-fire { background: linear-gradient(135deg, #f09819, #edde5d); border-bottom: 4px solid #b37400; color: #000; }
        .panic-crime { background: linear-gradient(135deg, #cb2d3e, #ef473a); border-bottom: 4px solid #8e1d29; }

        .panic-icon { font-size: 28px; margin-bottom: 8px; }

        /* BOTONES DE MENÚ PRINCIPAL */
        .main-nav {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-large {
            width: 100%;
            padding: 25px;
            font-size: 1.3rem;
            font-weight: 700;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            color: white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: 0.3s;
        }

        .btn-remis { background: linear-gradient(135deg, #ff416c, #ff4b2b); }
        .btn-servicios { background: linear-gradient(135deg, #3a7bd5, #00d2ff); }
        .btn-emergencia { background: linear-gradient(135deg, #232526, #414345); }
        .btn-farmacia { background: linear-gradient(135deg, #11998e, #38ef7d); }

        /* LISTAS DE SERVICIOS */
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .list-item {
            width: 100%;
            padding: 20px;
            background: #121212;
            border: 1px solid #222;
            border-radius: 15px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-align: left;
        }

        .list-item:active { background: #1a1a1a; }
        .list-item span.icon { font-size: 1.4rem; }

        .btn-volver {
            margin-top: 30px;
            padding: 18px;
            background: #333;
            color: white;
            border: none;
            border-radius: 15px;
            width: 100%;
            font-weight: bold;
            font-size: 1rem;
        }

        /* FORMULARIOS CONFIG */
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            color: #888;
            margin-bottom: 8px;
            margin-left: 5px;
        }

        input {
            width: 100%;
            padding: 18px;
            border-radius: 12px;
            border: 1px solid #333;
            background: #0a0a0a;
            color: white;
            font-size: 16px;
        }

        .btn-save {
            background: #28a745;
            color: white;
            padding: 20px;
            border-radius: 15px;
            width: 100%;
            font-weight: bold;
            font-size: 1.1rem;
            border: none;
            margin-top: 10px;
        }

        /* UTILES */
        .hidden { display: none !important; }
        .small-text { font-size: 13px; opacity: 0.6; display: block; font-weight: normal; margin-top: 4px; }

        /* BANNER INSTALACION */
        #pwa-banner {
            display: none;
            background: #28a745;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        /* SIRENA ANIMACION */
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(203, 45, 62, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(203, 45, 62, 0); }
            100% { box-shadow: 0 0 0 0 rgba(203, 45, 62, 0); }
        }
        .active-sos { animation: pulse-red 1.5s infinite; }

    </style>
</head>
<body>

    <div id="pwa-banner" onclick="instalarApp()">
        📲 Toca para añadir a tu pantalla de inicio
    </div>

    <div class="app-shell">
        <header>
            <img src="logo.png" alt="Accion Remis">
            <h1>Timbre Remis 🔔</h1>
        </header>

        <!-- PANTALLA 1: MENU PRINCIPAL -->
        <main class="container" id="screen-main">
            
            <div class="panic-container">
                <span class="panic-label">Botón de Pánico (Mantener 2s)</span>
                <div class="panic-panel">
                    <button class="panic-btn panic-medical" id="panic-med">
                        <span class="panic-icon">🏥</span>
                        <span>SALUD</span>
                    </button>
                    <button class="panic-btn panic-fire" id="panic-fire">
                        <span class="panic-icon">🔥</span>
                        <span>FUEGO</span>
                    </button>
                    <button class="panic-btn panic-crime" id="panic-crime">
                        <span class="panic-icon">👮</span>
                        <span>ROBO</span>
                    </button>
                </div>
            </div>

            <nav class="main-nav">
                <button class="btn-large btn-remis" onclick="navegar('screen-remis')">
                    <span>🚗</span> Pedir un Remis
                </button>
                <button class="btn-large btn-servicios" onclick="navegar('screen-servicios')">
                    <span>🏠</span> Servicios Casa
                </button>
                <button class="btn-large btn-emergencia" onclick="navegar('screen-emergencias')">
                    <span>🚨</span> Emergencias
                </button>
                <button class="btn-large btn-farmacia" onclick="abrirFarmacias()">
                    <span>💊</span> Farmacias de Turno
                </button>
            </nav>
        </main>

        <!-- PANTALLA 2: PEDIR REMIS -->
        <main class="container hidden" id="screen-remis">
            <h2 class="text-xl font-bold mb-6">¿Desde dónde viajas?</h2>
            <div class="list-container">
                <button class="list-item" onclick="remisDesde('Casa')">
                    <div>
                        <span>Desde Casa</span>
                        <span class="small-text" id="label-casa">No configurada</span>
                    </div>
                    <span class="icon">🏠</span>
                </button>
                <button class="list-item" onclick="remisDesde('Trabajo')">
                    <div>
                        <span>Desde el Trabajo</span>
                        <span class="small-text" id="label-trabajo">No configurado</span>
                    </div>
                    <span class="icon">💼</span>
                </button>
                <button class="list-item" onclick="remisDesde('Favorito')">
                    <div>
                        <span>Desde Favorito</span>
                        <span class="small-text" id="label-favorito">No configurado</span>
                    </div>
                    <span class="icon">⭐</span>
                </button>
                <button class="list-item" style="background: #1e3a8a;" onclick="remisGPS()">
                    <div>
                        <span>Mi Ubicación GPS</span>
                        <span class="small-text">Enviar mapa exacto</span>
                    </div>
                    <span class="icon">📍</span>
                </button>
            </div>
            
            <button class="btn-volver" style="background: #fbbf24; color: #000;" onclick="navegar('screen-config')">
                ⚙️ Configurar Direcciones y Datos
            </button>
            <button class="btn-volver" onclick="navegar('screen-main')">← Volver</button>
        </main>

        <!-- PANTALLA 3: SERVICIOS (LISTA ORIGINAL) -->
        <main class="container hidden" id="screen-servicios">
            <h2 class="text-xl font-bold mb-6">Servicios Domiciliarios</h2>
            <div class="list-container">
                <button class="list-item" onclick="llamar('3442666445')">Mecánico <span class="icon">🔧</span></button>
                <button class="list-item" onclick="llamar('3442424688')">Electricista <span class="icon">⚡</span></button>
                <button class="list-item" onclick="llamar('3442')">Gasista <span class="icon">🔥</span></button>
                <button class="list-item" onclick="llamar('3442406327')">Costurera <span class="icon">🧵</span></button>
                <button class="list-item" onclick="llamar('3442406327')">Estética Uñas y Cejas <span class="icon">💅</span></button>
                <button class="list-item" onclick="llamar('34246327')">Peluquería <span class="icon">💇</span></button>
                <button class="list-item" onclick="llamar('3442677247')">Zapatería <span class="icon">👟</span></button>
                <button class="list-item" onclick="llamar('3442426688')">Plomero <span class="icon">🚰</span></button>
                <button class="list-item" onclick="llamar('3442583937')">Limpieza Casas / Oficinas <span class="icon">🧹</span></button>
                <button class="list-item" onclick="llamar('3442485255')">Cuidado Señoras / Niños <span class="icon">👵</span></button>
                <button class="list-item" onclick="llamar('3442421234')">Cerrajería El Cerrojo <span class="icon">🔑</span></button>
            </div>
            <button class="btn-volver" onclick="navegar('screen-main')">← Volver</button>
        </main>

        <!-- PANTALLA 4: EMERGENCIAS -->
        <main class="container hidden" id="screen-emergencias">
            <h2 class="text-xl font-bold mb-6">Llamadas de Emergencia</h2>
            <div class="list-container">
                <button class="list-item" style="border-left: 5px solid red;" onclick="llamar('911')">POLICÍA (911)</button>
                <button class="list-item" style="border-left: 5px solid orange;" onclick="llamar('100')">BOMBEROS (100)</button>
                <button class="list-item" style="border-left: 5px solid blue;" onclick="llamar('107')">HOSPITAL (107)</button>
                <button class="list-item" onclick="llamar('08007770080')">ENERSA (Luz)</button>
                <button class="list-item" onclick="llamar('0800777427632')">GAS NEA (Gas)</button>
            </div>
            <button class="btn-volver" onclick="navegar('screen-main')">← Volver</button>
        </main>

        <!-- PANTALLA 5: CONFIGURACION -->
        <main class="container hidden" id="screen-config">
            <h2 class="text-xl font-bold mb-6">Mis Datos Guardados</h2>
            
            <div class="form-group">
                <label>Tu Apellido (para el Remis)</label>
                <input type="text" id="cfg-apellido" placeholder="Ej: Perez">
            </div>

            <div class="form-group">
                <label>Dirección de Casa</label>
                <input type="text" id="cfg-casa" placeholder="Calle y número">
            </div>

            <div class="form-group">
                <label>Dirección del Trabajo</label>
                <input type="text" id="cfg-trabajo" placeholder="Calle y número">
            </div>

            <div class="form-group">
                <label>Dirección Favorita</label>
                <input type="text" id="cfg-favorito" placeholder="Ej: Casa de mi hija">
            </div>

            <div class="form-group" style="background: #1a0000; padding: 15px; border-radius: 12px; border: 1px solid #300;">
                <label style="color: #ff4b2b; font-weight: bold;">WhatsApp de Pánico</label>
                <p class="text-xs text-gray-500 mb-2">Número que recibirá tus alertas SOS</p>
                <input type="tel" id="cfg-sos" placeholder="5493442000000">
            </div>

            <button class="btn-save" onclick="guardarTodo()">GUARDAR MIS DATOS</button>
            <button class="btn-volver" onclick="navegar('screen-remis')">Cancelar</button>
        </main>

        <!-- SONIDO DE SIRENA (Oculto) -->
        <audio id="audio-sirena" loop>
            <source src="https://assets.mixkit.co/active_storage/sfx/951/951-preview.mp3" type="audio/mpeg">
        </audio>

    </div>

    <script>
        // --- VARIABLES GLOBALES ---
        const WHATSAPP_REMIS = "5493442641200";
        let panicTimer = null;
        let deferredPrompt = null;

        // --- INICIO ---
        window.onload = () => {
            actualizarLabels();
            setupPanicButtons();
            
            if (!localStorage.getItem('apellido')) {
                alert("Bienvenido. Por favor configura tu apellido y direcciones para que la app funcione correctamente.");
                navegar('screen-config');
            }
        };

        // --- NAVEGACIÓN ---
        function navegar(id) {
            document.querySelectorAll('main').forEach(m => m.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        // --- FUNCIONES CORE ---
        function llamar(n) { window.location.href = "tel:" + n; }

        function abrirFarmacias() {
            window.open("https://www.elmiercolesdigital.com.ar/servicios/farmacias-de-turno/", "_blank");
        }

        // --- GESTIÓN DE DATOS ---
        function guardarTodo() {
            localStorage.setItem('apellido', document.getElementById('cfg-apellido').value);
            localStorage.setItem('dirCasa', document.getElementById('cfg-casa').value);
            localStorage.setItem('dirTrabajo', document.getElementById('cfg-trabajo').value);
            localStorage.setItem('dirFavorito', document.getElementById('cfg-favorito').value);
            localStorage.setItem('numSOS', document.getElementById('cfg-sos').value);
            
            actualizarLabels();
            alert("Datos guardados con éxito.");
            navegar('screen-remis');
        }

        function actualizarLabels() {
            const ap = localStorage.getItem('apellido') || "";
            const c = localStorage.getItem('dirCasa') || "";
            const t = localStorage.getItem('dirTrabajo') || "";
            const f = localStorage.getItem('dirFavorito') || "";
            const s = localStorage.getItem('numSOS') || "";

            document.getElementById('label-casa').innerText = c || "No configurada";
            document.getElementById('label-trabajo').innerText = t || "No configurado";
            document.getElementById('label-favorito').innerText = f || "No configurado";

            document.getElementById('cfg-apellido').value = ap;
            document.getElementById('cfg-casa').value = c;
            document.getElementById('cfg-trabajo').value = t;
            document.getElementById('cfg-favorito').value = f;
            document.getElementById('cfg-sos').value = s;
        }

        // --- LÓGICA REMIS ---
        function remisDesde(lugar) {
            const apellido = localStorage.getItem('apellido');
            const direccion = localStorage.getItem('dir' + lugar);

            if (!apellido || !direccion) {
                alert("Faltan datos. Ve a configuración.");
                return;
            }

            const mensaje = encodeURIComponent(`Hola, soy ${apellido}. Por favor, necesito un móvil en: ${direccion}. Gracias.`);
            window.location.href = `https://wa.me/${WHATSAPP_REMIS}?text=${mensaje}`;
        }

        function remisGPS() {
            const apellido = localStorage.getItem('apellido');
            if (!apellido) { alert("Configura tu apellido primero."); return; }

            navigator.geolocation.getCurrentPosition((pos) => {
                const link = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                const mensaje = encodeURIComponent(`Hola, soy ${apellido}. Necesito un móvil a mi ubicación actual: ${link}`);
                window.location.href = `https://wa.me/${WHATSAPP_REMIS}?text=${mensaje}`;
            }, () => alert("Error de GPS. Activa la ubicación."));
        }

        // --- LÓGICA PÁNICO (3 OPCIONES) ---
        function setupPanicButtons() {
            const buttons = [
                { id: 'panic-med', tipo: 'MÉDICA (DESCOMPOSTURA)' },
                { id: 'panic-fire', tipo: 'DE INCENDIO' },
                { id: 'panic-crime', tipo: 'POR ROBO/SEGURIDAD' }
            ];

            buttons.forEach(btn => {
                const el = document.getElementById(btn.id);
                
                const start = (e) => {
                    e.preventDefault();
                    el.classList.add('active-sos');
                    panicTimer = setTimeout(() => triggerPanic(btn.tipo), 2000);
                };

                const end = () => {
                    el.classList.remove('active-sos');
                    clearTimeout(panicTimer);
                };

                el.addEventListener('mousedown', start);
                el.addEventListener('mouseup', end);
                el.addEventListener('touchstart', start);
                el.addEventListener('touchend', end);
            });
        }

        function triggerPanic(tipo) {
            const sosNum = localStorage.getItem('numSOS');
            const sirena = document.getElementById('audio-sirena');
            
            if (!sosNum) {
                alert("Configura un número de WhatsApp SOS primero.");
                navegar('screen-config');
                return;
            }

            sirena.play();

            navigator.geolocation.getCurrentPosition((pos) => {
                const link = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                const mensaje = encodeURIComponent(`¡AYUDA URGENTE! Emergencia ${tipo}. Mi ubicación: ${link}`);
                window.open(`https://wa.me/${sosNum}?text=${mensaje}`, '_blank');
            }, () => {
                const mensaje = encodeURIComponent(`¡AYUDA URGENTE! Emergencia ${tipo}. (No se pudo obtener GPS)`);
                window.open(`https://wa.me/${sosNum}?text=${mensaje}`, '_blank');
            });

            setTimeout(() => { sirena.pause(); sirena.currentTime = 0; }, 10000);
        }

        // --- PWA INSTALACIÓN ---
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('pwa-banner').style.display = 'block';
        });

        function instalarApp() {
            if (!deferredPrompt) return;
            deferredPrompt.prompt();
            deferredPrompt.userChoice.then(() => {
                deferredPrompt = null;
                document.getElementById('pwa-banner').style.display = 'none';
            });
        }
    </script>
</body>
</html>
