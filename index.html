<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timbre Remis</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:black;
    color:white;
    text-align:center;
}

.logo{
    margin-top:20px;
}

.logo img{
    width:160px;
}

h1{
    margin:10px 0 30px 0;
}

.boton{
    width:85%;
    margin:12px auto;
    padding:18px;
    border-radius:15px;
    font-size:20px;
    border:none;
    color:white;
    cursor:pointer;
    display:block;
}

.casa{
    background:linear-gradient(to bottom,#ff2a2a,#b30000);
}

.trabajo{
    background:linear-gradient(to bottom,#e60000,#8f0000);
}

.favorito{
    background:linear-gradient(to bottom,#cc0000,#6f0000);
}

.mapa{
    background:linear-gradient(to bottom,#0077cc,#003f73);
}

.consulta{
    background:linear-gradient(to bottom,#666,#333);
    font-size:16px;
    padding:14px;
}

.config{
    position:fixed;
    bottom:20px;
    right:20px;
    width:60px;
    height:60px;
    border-radius:50%;
    background:#444;
    color:white;
    font-size:24px;
    border:none;
}

.mensaje{
    margin-top:20px;
    font-size:18px;
    display:none;
}
</style>
</head>

<body>

<div class="logo">
<img src="logo.png">
</div>

<h1>Timbre Remis</h1>

<button class="boton casa" onclick="pedirViaje('casa')">Casa 🏡</button>
<button class="boton trabajo" onclick="pedirViaje('trabajo')">Trabajo 🛠️</button>
<button class="boton favorito" onclick="pedirViaje('favorito')">Favorito ⭐</button>
<button class="boton mapa" onclick="ubicacionActual()">Ubicación actual 🗺️</button>

<button class="boton consulta" onclick="consultaTarifa()">💲 Consulta tarifa</button>

<button class="config" onclick="configurar()">⚙️</button>

<div id="mensaje" class="mensaje">Enviando pedido...</div>

<script>

const numeroEmpresa="5493442641200";

function obtenerDireccion(tipo){
    return localStorage.getItem(tipo);
}

function pedirViaje(tipo){
    let direccion=obtenerDireccion(tipo);
    if(!direccion){
        configurar();
        return;
    }
    enviarWhatsApp("Hola, quiero un remis desde "+direccion);
}

function ubicacionActual(){
    if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(function(pos){
            let lat=pos.coords.latitude;
            let lon=pos.coords.longitude;
            let link="https://maps.google.com/?q="+lat+","+lon;
            enviarWhatsApp("Hola, quiero un remis desde mi ubicación: "+link);
        });
    }
}

function consultaTarifa(){
    let origen=prompt("¿Desde dónde parte? Escriba: casa, trabajo, favorito o mapa");
    if(!origen) return;

    let direccion="";
    if(origen==="mapa"){
        navigator.geolocation.getCurrentPosition(function(pos){
            let lat=pos.coords.latitude;
            let lon=pos.coords.longitude;
            direccion="https://maps.google.com/?q="+lat+","+lon;
            pedirDestino(direccion);
        });
    }else{
        direccion=obtenerDireccion(origen);
        if(!direccion){
            alert("Primero configure esa dirección.");
            return;
        }
        pedirDestino(direccion);
    }
}

function pedirDestino(origen){
    let destino=prompt("¿Cuál es el destino?");
    if(!destino) return;
    enviarWhatsApp("Consulta tarifa desde "+origen+" hasta "+destino);
}

function enviarWhatsApp(texto){
    document.getElementById("mensaje").style.display="block";
    let url="https://wa.me/"+numeroEmpresa+"?text="+encodeURIComponent(texto);
    setTimeout(()=>{
        window.location.href=url;
    },1000);
}

function configurar(){
    let casa=prompt("Ingrese dirección de CASA", obtenerDireccion("casa")||"");
    if(casa) localStorage.setItem("casa",casa);

    let trabajo=prompt("Ingrese dirección de TRABAJO", obtenerDireccion("trabajo")||"");
    if(trabajo) localStorage.setItem("trabajo",trabajo);

    let favorito=prompt("Ingrese dirección FAVORITA", obtenerDireccion("favorito")||"");
    if(favorito) localStorage.setItem("favorito",favorito);
}

</script>

</body>
</html>
