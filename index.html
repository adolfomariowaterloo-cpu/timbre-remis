<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🚕 Timbre Remis</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#000;
  color:white;
  text-align:center;
}

header{
  padding:20px 10px 10px 10px;
}

header h1{
  margin:5px 0;
  font-size:32px;
}

.logo{
  font-size:60px;
}

.container{
  padding:20px;
}

button{
  width:90%;
  max-width:400px;
  margin:12px auto;
  padding:18px;
  font-size:20px;
  border:none;
  border-radius:18px;
  cursor:pointer;
  display:block;
  color:white;
  font-weight:bold;
  box-shadow:0 6px 0 rgba(0,0,0,0.5);
  transition:all 0.1s;
}

button:active{
  transform:translateY(4px);
  box-shadow:0 2px 0 rgba(0,0,0,0.5);
}

/* BOTONES PRINCIPALES */

.casa{
  background:linear-gradient(#ff2b2b,#b30000);
}

.trabajo{
  background:linear-gradient(#ff8c00,#cc5500);
}

.otros{
  background:linear-gradient(#2a9df4,#0b5fa5);
}

.config{
  width:60%;
  font-size:16px;
  padding:10px;
  background:#444;
  box-shadow:none;
}

/* CONFIGURACION */

input{
  width:85%;
  padding:10px;
  margin:10px 0;
  font-size:16px;
  border-radius:8px;
  border:none;
}

.guardar{
  background:#28a745;
  color:white;
  font-weight:bold;
}

.small{
  font-size:14px;
  display:block;
  margin-top:5px;
  font-weight:normal;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<header>
  <div class="logo">🚕🔔</div>
  <h1>Timbre Remis</h1>
</header>

<div class="container" id="principal">

  <button class="casa" onclick="pedirDesde('casa')">
    🏠 Desde Casa
    <span class="small" id="dirCasaTexto"></span>
  </button>

  <button class="trabajo" onclick="pedirDesde('trabajo')">
    🛠️ Desde Trabajo
    <span class="small" id="dirTrabajoTexto"></span>
  </button>

  <button class="otros" onclick="pedirUbicacion()">
    📍 Ubicación Actual
  </button>

  <button class="config" onclick="mostrarConfig()">
    ⚙️ Configuración
  </button>

</div>

<div class="container hidden" id="configuracion">

  <h2>Configuración</h2>

  <input type="text" id="apellido" placeholder="Apellido del pasajero">

  <input type="text" id="dirCasa" placeholder="Dirección Casa">

  <input type="text" id="dirTrabajo" placeholder="Dirección Trabajo">

  <button class="guardar" onclick="guardarConfig()">Guardar</button>

  <button class="config" onclick="volver()">Volver</button>

</div>

<script>

const telefonoEmpresa = "5493442641200";

/* CARGAR DATOS GUARDADOS */
window.onload = function(){
  document.getElementById("apellido").value = localStorage.getItem("apellido") || "";
  document.getElementById("dirCasa").value = localStorage.getItem("dirCasa") || "";
  document.getElementById("dirTrabajo").value = localStorage.getItem("dirTrabajo") || "";

  actualizarTextos();
}

function actualizarTextos(){
  const casa = localStorage.getItem("dirCasa");
  const trabajo = localStorage.getItem("dirTrabajo");

  document.getElementById("dirCasaTexto").innerText = casa ? casa : "";
  document.getElementById("dirTrabajoTexto").innerText = trabajo ? trabajo : "";
}

function mostrarConfig(){
  document.getElementById("principal").classList.add("hidden");
  document.getElementById("configuracion").classList.remove("hidden");
}

function volver(){
  document.getElementById("configuracion").classList.add("hidden");
  document.getElementById("principal").classList.remove("hidden");
}

function guardarConfig(){
  localStorage.setItem("apellido", document.getElementById("apellido").value);
  localStorage.setItem("dirCasa", document.getElementById("dirCasa").value);
  localStorage.setItem("dirTrabajo", document.getElementById("dirTrabajo").value);

  actualizarTextos();
  alert("Datos guardados correctamente");
  volver();
}

/* PEDIDOS */

function pedirDesde(tipo){

  const apellido = localStorage.getItem("apellido");
  if(!apellido){
    alert("Debe configurar su apellido primero.");
    mostrarConfig();
    return;
  }

  let direccion = "";

  if(tipo === "casa"){
    direccion = localStorage.getItem("dirCasa");
  }else{
    direccion = localStorage.getItem("dirTrabajo");
  }

  if(!direccion){
    mostrarConfig();
    return;
  }

  enviarWhatsApp(apellido, direccion);
}

function pedirUbicacion(){

  const apellido = localStorage.getItem("apellido");
  if(!apellido){
    alert("Debe configurar su apellido primero.");
    mostrarConfig();
    return;
  }

  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(function(pos){
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const link = "https://maps.google.com/?q="+lat+","+lon;
      enviarWhatsApp(apellido, link);
    }, function(){
      alert("No se pudo obtener ubicación.");
    });
  }else{
    alert("Geolocalización no soportada.");
  }
}

function enviarWhatsApp(apellido, origen){

  const mensaje = "Hola, soy "+apellido+". Solicito un móvil desde: "+origen;
  const url = "https://wa.me/"+telefonoEmpresa+"?text="+encodeURIComponent(mensaje);

  window.open(url, "_blank");
}

</script>

</body>
</html>
