<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <title>Acción Remis - App Oficial</title>
    
    <!-- Librería para generar el QR automáticamente -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        /* =========================================
           CONFIGURACIÓN DE ESTILOS (CSS)
           ========================================= */
        :root {
            --rojo-accion: #ff2b2b;
            --rojo-oscuro: #8b0000;
            --azul-servicios: #2a9df4;
            --azul-oscuro: #154c79;
            --verde-exito: #28a745;
            --verde-oscuro: #1e7e34;
            --negro-absoluto: #000000;
            --blanco: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--negro-absoluto);
            color: var(--blanco);
            text-align: center;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        /* BANNER DE INSTALACIÓN PWA */
        #instalarBanner {
            display: none;
            background: linear-gradient(to bottom, #28a745, #1e7e34);
            padding: 25px;
            position: sticky;
            top: 0;
            z-index: 99999;
            border-bottom: 3px solid white;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
        }

        #instalarBanner p {
            margin: 0 0 15px 0;
            font-weight: bold;
            font-size: 19px;
            color: white;
        }

        #instalarBanner button {
            background-color: white;
            color: #1e7e34;
            padding: 14px 35px;
            font-size: 17px;
            font-weight: 900;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            width: auto;
            display: inline-block;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        /* CABECERA */
        header {
            padding: 40px 20px;
            background: linear-gradient(to bottom, #111 0%, #000 100%);
        }

        header img {
            width: 180px;
            height: auto;
            border-radius: 25px;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.2);
            border: 2px solid #333;
        }

        header h1 {
            margin: 25px 0 10px 0;
            font-size: 34px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--rojo-accion);
            text-shadow: 2px 2px 10px rgba(255,0,0,0.3);
        }

        /* CONTENEDOR GENERAL */
        .container {
            padding: 10px 25px 180px 25px;
            max-width: 550px;
            margin: 0 auto;
            position: relative;
        }

        /* ESTILO DE LOS BOTONES "TIMBRE" */
        button {
            width: 100%;
            margin: 18px 0;
            padding: 26px;
            font-size: 22px;
            border: none;
            border-radius: 22px;
            cursor: pointer;
            color: white;
            font-weight: 800;
            display: block;
            box-shadow: 0 9px 0 rgba(0,0,0,0.7);
            transition: all 0.1s ease;
            position: relative;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            letter-spacing: 0.5px;
        }

        button:active {
            transform: translateY(5px);
            box-shadow: 0 3px 0 rgba(0,0,0,0.7);
        }

        /* COLORES POR CATEGORÍA */
        .remis, .casa { background: linear-gradient(135deg, #ff2b2b 0%, #8b0000 100%); }
        .servicios, .ubicacion { background: linear-gradient(135deg, #2a9df4 0%, #154c79 100%); }
        .emergencia { background: linear-gradient(135deg, #d32f2f 0%, #7b1fa2 100%); }
        .util, .trabajo { background: linear-gradient(135deg, #0066cc 0%, #002244 100%); }
        .farmacia { background: linear-gradient(135deg, #00c853 0%, #006400 100%); }
        .eventos, .favorito { background: linear-gradient(135deg, #e1306c 0%, #833ab4 100%); }
        .compartir { background: linear-gradient(135deg, #25D366 0%, #128C7E 100%); }
        
        .volver { background-color: #333333; border: 1px solid #555; margin-top: 40px; }
        .config { background-color: #444444; margin-top: 25px; }
        .guardar { background-color: #28a745; margin-top: 35px; }

        /* SUBTEXTOS */
        .small {
            font-size: 16px;
            display: block;
            margin-top: 10px;
            font-weight: 400;
            opacity: 0.9;
            color: #ffffff;
            font-style: italic;
        }

        .hidden { display: none !important; }

        /* INDICADOR DE SCROLL */
        .scroll-indicator {
            position: fixed;
            bottom: 140px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.15);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            animation: bounceIndicator 2s infinite;
            z-index: 5000;
            border: 1px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(5px);
        }

        @keyframes bounceIndicator {
            0%, 20%, 50%, 80%, 100% { transform: translateX(-50%) translateY(0); }
            40% { transform: translateX(-50%) translateY(-12px); }
            60% { transform: translateX(-50%) translateY(-6px); }
        }

        /* FORMULARIOS Y CONFIGURACIÓN */
        h3 { font-size: 26px; margin-bottom: 25px; color: var(--azul-servicios); text-transform: uppercase; }
        label { display: block; text-align: left; margin: 20px 0 8px 8px; color: #bbbbbb; font-size: 15px; font-weight: bold; }

        input {
            width: 100%; box-sizing: border-box; padding: 22px; margin-bottom: 12px;
            font-size: 19px; border-radius: 18px; border: 2px solid #333;
            background-color: #111111; color: #ffffff; outline: none;
        }

        /* MODAL QR */
        #qr-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100000;
        }
        #qrcode {
            background: white;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 30px;
        }

        /* BOTÓN SOS Y SISTEMA DE PÁNICO */
        #panic-wrapper {
            position: fixed;
            bottom: 35px;
            right: 25px;
            z-index: 9999;
            text-align: center;
        }

        #textoSOS {
            background-color: #ff0000; color: #ffffff; padding: 7px 18px;
            border-radius: 12px; font-weight: 900; font-size: 17px;
            margin-bottom: 10px; border: 2px solid white;
        }

        #botonPanico {
            width: 95px; height: 95px; background-color: #ff0000;
            border-radius: 50%; border: 6px solid #ffffff;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 12px 25px rgba(255,0,0,0.6);
            touch-action: none;
        }

        #botonPanico.activo {
            background-color: #00ff00;
            box-shadow: 0 0 0 300vw rgba(0, 255, 0, 0.95);
            animation: pulseSOS 0.35s infinite;
        }

        @keyframes pulseSOS {
            0% { transform: scale(1); }
            50% { transform: scale(1.25); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- MODAL PARA CÓDIGO QR -->
    <div id="qr-modal" onclick="cerrarQR()">
        <h2 style="color:white; margin-bottom:20px;">Escaneá para Instalar</h2>
        <div id="qrcode"></div>
        <button class="volver" style="width:80%" onclick="cerrarQR()">CERRAR QR</button>
        <p style="color:#aaa; margin-top:15px; font-size:14px;">Mostrá este código a otro celular</p>
    </div>

    <!-- BANNER DE INSTALACIÓN -->
    <div id="instalarBanner">
        <p>¿Querés tener el acceso de Acción en tu inicio?</p>
        <button onclick="instalarApp()">AGREGAR AHORA</button>
    </div>

    <header>
        <img src="logo.png" alt="Acción Remis" onerror="this.src='https://via.placeholder.com/180x110?text=ACCION+REMIS'">
        <h1>Timbre Remis 🔔</h1>
    </header>

    <!-- INDICADOR DE SCROLL -->
    <div class="scroll-indicator" id="scrollArrow">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="white">
            <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
        </svg>
    </div>

    <!-- PANTALLA 1: MENÚ PRINCIPAL -->
    <div class="container" id="menuPrincipal">
        <button class="remis" onclick="abrirMenu('menuRemis')">Pedir un Remis</button>
        <button class="servicios" onclick="abrirMenu('menuServicios')">Servicios Domiciliarios</button>
        <button class="emergencia" onclick="abrirMenu('menuEmergencias')">Emergencias</button>
        <button class="util" onclick="abrirMenu('menuUtiles')">Teléfonos Útiles</button>
        <button class="farmacia" onclick="abrirFarmacia()">Farmacias de Turno</button>
        <button class="eventos" onclick="window.open('https://www.instagram.com/eventos.cdelu/','_blank')">Eventos Locales</button>
        
        <!-- BOTÓN NUEVO: COMPARTIR APP -->
        <button class="compartir" onclick="abrirMenu('menuCompartir')">Compartir esta App 📲</button>
    </div>

    <!-- PANTALLA 2: SUBMENÚ REMIS -->
    <div class="container hidden" id="menuRemis">
        <button class="casa" onclick="pedirDesde('casa')">Desde Casa <span class="small" id="txt-casa">No configurado</span></button>
        <button class="trabajo" onclick="pedirDesde('trabajo')">Desde Trabajo <span class="small" id="txt-trabajo">No configurado</span></button>
        <button class="favorito" onclick="pedirDesde('favorito')">Desde Favorito <span class="small" id="txt-favorito">No configurado</span></button>
        <button class="ubicacion" onclick="pedirUbicacion()">Enviar Mi Ubicación GPS</button>
        <button class="config" onclick="abrirMenu('configuracion')">⚙️ Configurar Mis Datos</button>
        <button class="volver" onclick="volverPrincipal()">Volver al Inicio</button>
    </div>

    <!-- PANTALLA 3: SERVICIOS DOMICILIARIOS -->
    <div class="container hidden" id="menuServicios">
        <button class="util" onclick="llamar('3442666445')">Mecánico</button>
        <button class="util" onclick="llamar('3442424688')">Electricista</button>
        <button class="util" onclick="llamar('3442426688')">Plomero / Gasista</button>
        <button class="util" onclick="llamar('3442406327')">Costurera</button>
        <button class="util" onclick="llamar('3442406327')">Estética Uñas</button>
        <button class="util" onclick="llamar('34246327')">Peluquería</button>
        <button class="util" onclick="llamar('3442677247')">Zapatería</button>
        <button class="util" onclick="llamar('3442583937')">Limpieza</button>
        <button class="util" onclick="llamar('3442485255')">Cuidado Personas</button>
        <button class="util" onclick="llamar('3442456789')">Fletes y Mudanzas</button>
        <button class="util" onclick="llamar('3442123456')">Jardinería / Poda</button>
        <button class="util" onclick="llamar('3442999999')">Cerrajero 24hs</button>
        <button class="volver" onclick="volverPrincipal()">Volver</button>
    </div>

    <!-- PANTALLA 4: EMERGENCIAS -->
    <div class="container hidden" id="menuEmergencias">
        <button class="emergencia" onclick="llamar('101')">Policía (101)</button>
        <button class="emergencia" onclick="llamar('100')">Bomberos (100)</button>
        <button class="emergencia" onclick="llamar('107')">Ambulancia Hospital (107)</button>
        <button class="emergencia" onclick="llamar('3442660877')">Vida Emergencias</button>
        <button class="emergencia" onclick="llamar('424242')">Círculo Católico</button>
        <button class="emergencia" onclick="llamar('425294')">ALERTA Emergencias</button>
        <button class="emergencia" onclick="llamar('08007770080')">ENERSA (Luz)</button>
        <button class="emergencia" onclick="llamar('0800777427632')">GAS NEA (Fugas)</button>
        <button class="volver" onclick="volverPrincipal()">Volver</button>
    </div>

    <!-- PANTALLA 5: ÚTILES -->
    <div class="container hidden" id="menuUtiles">
        <button class="util" onclick="llamar('443901')">Hospital J.J. Urquiza</button>
        <button class="util" onclick="llamar('422352')">Terminal de Ómnibus</button>
        <button class="util" onclick="llamar('103')">Guardia Urbana (103)</button>
        <button class="util" onclick="llamar('106')">Prefectura Naval (106)</button>
        <button class="util" onclick="llamar('427654')">Cooperativa Eléctrica</button>
        <button class="util" onclick="llamar('423333')">Municipalidad Cdelu</button>
        <button class="volver" onclick="volverPrincipal()">Volver</button>
    </div>

    <!-- PANTALLA 6: COMPARTIR APP -->
    <div class="container hidden" id="menuCompartir">
        <h3>Pasarle la App a otro celular</h3>
        
        <p style="color:#aaa; font-size:14px; margin-bottom:20px;">
            ¡Ayudanos a crecer! Pasale la herramienta a un amigo o familiar.
        </p>

        <button class="compartir" onclick="enviarPorWhatsApp()">
            Enviar por WhatsApp 💬
        </button>

        <button class="util" onclick="mostrarQR()">
            Mostrar Código QR 🔳
        </button>

        <button class="config" onclick="copiarLink()">
            Copiar Link al Portapapeles 📋
        </button>

        <button class="volver" onclick="volverPrincipal()">
            Volver
        </button>
    </div>

    <!-- PANTALLA 7: CONFIGURACIÓN -->
    <div class="container hidden" id="configuracion">
        <h3>Tus Datos Guardados</h3>
        <label>Apellido para el Remis:</label>
        <input type="text" id="cfg-ape" placeholder="Ej: Perez">
        <label>Dirección de Casa:</label>
        <input type="text" id="cfg-casa" placeholder="Ej: Urquiza 100">
        <label>Dirección de Trabajo:</label>
        <input type="text" id="cfg-trab" placeholder="Ej: Galarza 500">
        <label>Dirección Favorita:</label>
        <input type="text" id="cfg-fav" placeholder="Ej: Club Rivadavia">
        
        <h4 style="margin:35px 0 10px; color:#ff0000; text-transform:uppercase;">Contactos de SOS</h4>
        <label>SOS 1:</label><input type="number" id="cfg-sos1" placeholder="5493442...">
        <label>SOS 2:</label><input type="number" id="cfg-sos2" placeholder="5493442...">
        <label>SOS 3:</label><input type="number" id="cfg-sos3" placeholder="5493442...">
        
        <h4 style="margin:35px 0 10px; color:#2a9df4; text-transform:uppercase;">Configuración de la App</h4>
        <label>Link de tu App (GitHub/Web):</label>
        <input type="text" id="cfg-url" placeholder="https://tuusuario.github.io/accion">

        <button class="guardar" onclick="guardarConfig()">GUARDAR TODO</button>
        <button class="volver" onclick="abrirMenu('menuRemis')">CANCELAR</button>
    </div>

    <!-- BOTÓN SOS -->
    <div id="panic-wrapper">
        <div id="textoSOS">BOTÓN SOS</div>
        <div id="botonPanico">
            <svg viewBox="0 0 24 24"><path d="M12,2L1,21H23M12,6L19.53,19H4.47M11,10V14H13V10M11,16V18H13V16" /></svg>
        </div>
    </div>

    <audio id="sirena" loop><source src="sirena.mp3" type="audio/mpeg"></audio>

    <script>
        const NUM_REMIS = "5493442641200";
        let timerSOS;
        let deferredPrompt;

        window.onload = function() {
            cargarDatosDesdeMemoria();
            window.addEventListener('scroll', controlFlechaScroll);
            window.addEventListener('focus', function() {
                document.getElementById("botonPanico").classList.remove("activo");
                document.getElementById("sirena").pause();
            });
            controlFlechaScroll();
        };

        // NAVEGACIÓN
        function abrirMenu(id) {
            const ms = ["menuPrincipal", "menuRemis", "menuEmergencias", "menuUtiles", "menuServicios", "configuracion", "menuCompartir"];
            ms.forEach(m => document.getElementById(m).classList.add("hidden"));
            document.getElementById(id).classList.remove("hidden");
            window.scrollTo(0, 0);
            setTimeout(controlFlechaScroll, 200);
        }

        function volverPrincipal() { abrirMenu("menuPrincipal"); }
        function llamar(n) { window.location.href = "tel:" + n; }
        function abrirFarmacia() { window.open("https://www.elmiercolesdigital.com.ar/servicios/farmacias-de-turno/", "_blank"); }

        // COMPARTIR APP
        function getAppLink() {
            return localStorage.getItem("acc_url") || window.location.href;
        }

        function enviarPorWhatsApp() {
            const link = getAppLink();
            const msg = `¡Hola! Te comparto la App de Timbre Acción Remis. Es ideal para pedir móviles y tener todos los números de emergencia de Cdelu a mano. Abrilo acá: ${link}`;
            window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function copiarLink() {
            const link = getAppLink();
            const el = document.createElement('textarea');
            el.value = link;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            alert("Link copiado al portapapeles. ¡Ya podés pegarlo donde quieras!");
        }

        function mostrarQR() {
            const link = getAppLink();
            document.getElementById("qrcode").innerHTML = ""; // Limpiar previo
            new QRCode(document.getElementById("qrcode"), {
                text: link,
                width: 250,
                height: 250
            });
            document.getElementById("qr-modal").style.display = "flex";
        }

        function cerrarQR() {
            document.getElementById("qr-modal").style.display = "none";
        }

        // FLECHA SCROLL
        function controlFlechaScroll() {
            const f = document.getElementById("scrollArrow");
            if (window.innerHeight + window.scrollY < document.body.offsetHeight - 100) {
                f.style.display = "flex";
            } else {
                f.style.display = "none";
            }
        }

        // DATOS
        function guardarConfig() {
            localStorage.setItem("acc_ape", document.getElementById("cfg-ape").value);
            localStorage.setItem("acc_casa", document.getElementById("cfg-casa").value);
            localStorage.setItem("acc_trab", document.getElementById("cfg-trab").value);
            localStorage.setItem("acc_fav", document.getElementById("cfg-fav").value);
            localStorage.setItem("acc_sos1", document.getElementById("cfg-sos1").value);
            localStorage.setItem("acc_sos2", document.getElementById("cfg-sos2").value);
            localStorage.setItem("acc_sos3", document.getElementById("cfg-sos3").value);
            localStorage.setItem("acc_url", document.getElementById("cfg-url").value);
            cargarDatosDesdeMemoria();
            alert("¡Configuración guardada!");
            abrirMenu("menuRemis");
        }

        function cargarDatosDesdeMemoria() {
            document.getElementById("txt-casa").innerText = localStorage.getItem("acc_casa") || "No configurado";
            document.getElementById("txt-trabajo").innerText = localStorage.getItem("acc_trab") || "No configurado";
            document.getElementById("txt-favorito").innerText = localStorage.getItem("acc_fav") || "No configurado";
            
            document.getElementById("cfg-ape").value = localStorage.getItem("acc_ape") || "";
            document.getElementById("cfg-casa").value = localStorage.getItem("acc_casa") || "";
            document.getElementById("cfg-trab").value = localStorage.getItem("acc_trab") || "";
            document.getElementById("cfg-fav").value = localStorage.getItem("acc_fav") || "";
            document.getElementById("cfg-sos1").value = localStorage.getItem("acc_sos1") || "";
            document.getElementById("cfg-sos2").value = localStorage.getItem("acc_sos2") || "";
            document.getElementById("cfg-sos3").value = localStorage.getItem("acc_sos3") || "";
            document.getElementById("cfg-url").value = localStorage.getItem("acc_url") || window.location.href;
        }

        // REMIS
        function pedirDesde(t) {
            const a = localStorage.getItem("acc_ape");
            const d = localStorage.getItem("acc_" + t);
            if (!a || !d || d === "undefined") return abrirMenu("configuracion");
            const msg = `Hola Acción, soy ${a}. Móvil a mi ${t}: ${d}`;
            window.open(`https://wa.me/${NUM_REMIS}?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function pedirUbicacion() {
            const a = localStorage.getItem("acc_ape");
            if (!a) return abrirMenu("configuracion");
            navigator.geolocation.getCurrentPosition(p => {
                const link = `https://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}`;
                const msg = `Hola Acción, soy ${a}. Mi ubicación GPS: ${link}`;
                window.open(`https://wa.me/${NUM_REMIS}?text=${encodeURIComponent(msg)}`, '_blank');
            }, () => alert("GPS desactivado"));
        }

        // SOS
        const bP = document.getElementById("botonPanico");
        function dispararSOS() {
            bP.classList.add("activo");
            document.getElementById("sirena").play().catch(()=>{});
            navigator.geolocation.getCurrentPosition(p => {
                const link = `https://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}`;
                const m = `⚠️ EMERGENCIA SOS: Ayuda urgente en ${link}`;
                const n = localStorage.getItem("acc_sos1");
                if (n) window.open(`https://wa.me/${n}?text=${encodeURIComponent(m)}`, '_blank');
            });
            setTimeout(() => { bP.classList.remove("activo"); document.getElementById("sirena").pause(); }, 15000);
        }

        bP.onmousedown = bP.ontouchstart = (e) => { e.preventDefault(); timerSOS = setTimeout(dispararSOS, 2000); };
        bP.onmouseup = bP.ontouchend = () => clearTimeout(timerSOS);

        // PWA
        window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferredPrompt = e; document.getElementById("instalarBanner").style.display = "block"; });
        function instalarApp() { if (deferredPrompt) { document.getElementById("instalarBanner").style.display = "none"; deferredPrompt.prompt(); } }
    </script>
</body>
</html>
