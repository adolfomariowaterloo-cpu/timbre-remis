<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Acción Remis - Cdelu Oficial</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Acción Remis">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --rojo-accion: #ff2b2b;
            --negro: #000000;
            --verde-wa: #25D366;
            --celeste: #2196F3;
            --naranja: #FF9800;
            --violeta: #9C27B0;
            --verde-farmacia: #4CAF50;
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            margin: 0; 
            padding: 0; 
            touch-action: manipulation;
            user-select: none;
            -webkit-touch-callout: none;
        }
        
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--negro);
            color: white;
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* ... (todos los estilos previos se mantienen, solo agregamos los nuevos) ... */

        /* Nuevo: círculo de progreso para el botón de pánico */
        .panic-progress {
            position: absolute;
            top: -5px;
            left: -5px;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: conic-gradient(#ffcc00 0deg, rgba(255,204,0,0.3) 0deg);
            transition: all 0.05s linear;
            pointer-events: none;
            z-index: 1;
        }

        /* Ajustes para el botón de pánico */
        #panic-trigger {
            position: relative;
        }
        .panic-circle {
            position: relative;
            z-index: 2;
        }
    </style>
</head>
<body>

    <!-- ... (todo el HTML igual que antes, solo cambia el botón de pánico y el script) ... -->

    <!-- Botón pánico con long press -->
    <div id="panic-trigger">
        <div id="panic-progress" class="panic-progress" style="display: none;"></div>
        <div id="panic-circle" class="panic-circle">⚠️</div>
        <div id="panic-menu" class="panic-menu hidden">
            <div class="panic-option" data-type="danger">
                <span class="panic-icon">🔴</span>
                <span class="panic-text">PELIGRO INMEDIATO</span>
                <span class="panic-desc">Robo / violencia / riesgo de vida</span>
            </div>
            <div class="panic-option" data-type="medical">
                <span class="panic-icon">🟠</span>
                <span class="panic-text">EMERGENCIA MÉDICA</span>
                <span class="panic-desc">Descompostura / accidente / salud</span>
            </div>
            <div class="panic-option" data-type="warning">
                <span class="panic-icon">🟡</span>
                <span class="panic-text">SITUACIÓN SOSPECHOSA</span>
                <span class="panic-desc">Algo raro / necesidad de contacto</span>
            </div>
            <div class="panic-cancel">✖ CANCELAR</div>
        </div>
    </div>

    <script>
        // ==================== VARIABLES GLOBALES ====================
        let deferredPrompt;
        let qrInstance = null;
        const WHATSAPP_CENTRAL = "5493442641200";
        let panicTimer = null;
        let panicProgressInterval = null;
        let panicStartTime = 0;
        let menuAbierto = false;

        // ... (todas las funciones previas iguales hasta la función togglePanicoMenu) ...

        // ==================== NUEVA LÓGICA DEL BOTÓN DE PÁNICO (LONG PRESS) ====================
        function startPanicPress(e) {
            e.preventDefault();
            // Si el menú está abierto, no activamos el long press
            const menu = document.getElementById('panic-menu');
            if (menu && !menu.classList.contains('hidden')) {
                return;
            }
            panicStartTime = Date.now();
            const progressDiv = document.getElementById('panic-progress');
            progressDiv.style.display = 'block';
            let angle = 0;
            panicProgressInterval = setInterval(() => {
                const elapsed = Date.now() - panicStartTime;
                const percent = Math.min(100, (elapsed / 3000) * 100);
                const deg = (percent / 100) * 360;
                progressDiv.style.background = `conic-gradient(#ffcc00 ${deg}deg, rgba(255,204,0,0.3) ${deg}deg)`;
                if (percent >= 100) {
                    clearInterval(panicProgressInterval);
                    progressDiv.style.display = 'none';
                    // Activar peligro inmediato
                    activarPanico('danger');
                    // Cerrar menú si estaba abierto
                    const menu = document.getElementById('panic-menu');
                    if (menu && !menu.classList.contains('hidden')) {
                        menu.classList.add('hidden');
                        menuAbierto = false;
                    }
                }
            }, 30);
            panicTimer = setTimeout(() => {
                // Ya se activó en el intervalo, pero por si acaso
                clearTimeout(panicTimer);
            }, 3000);
        }

        function endPanicPress(e) {
            e.preventDefault();
            clearTimeout(panicTimer);
            clearInterval(panicProgressInterval);
            const progressDiv = document.getElementById('panic-progress');
            progressDiv.style.display = 'none';
            const elapsed = Date.now() - panicStartTime;
            // Si fue un toque corto (menos de 300ms), mostramos el menú
            if (elapsed < 300) {
                const menu = document.getElementById('panic-menu');
                if (menu) {
                    menu.classList.toggle('hidden');
                    menuAbierto = !menu.classList.contains('hidden');
                }
            }
            panicStartTime = 0;
        }

        // ==================== FUNCIÓN ACTIVAR PÁNICO MODIFICADA ====================
        function activarPanico(tipo) {
            ejecutarConTerminos(() => {
                if (!verificarInternet()) return;

                const nombre = limpiarTexto(localStorage.getItem('acc_ape') || "Persona");
                const contactoPrincipal = localStorage.getItem('acc_s1');
                const grupoLink = localStorage.getItem('acc_grupo_wa');
                const tiempoEspera = parseInt(localStorage.getItem('acc_tiempo_espera') || "12");
                const tieneGrupo = grupoLink && grupoLink.trim() !== "";

                // Función auxiliar para enviar WhatsApp al grupo con ubicación
                const enviarMensajeGrupo = (tipoMsg, ubicacionUrl = "") => {
                    if (!tieneGrupo) return false;
                    let mensaje = "";
                    if (tipoMsg === 'danger') {
                        mensaje = `🔴 ¡ALERTA MÁXIMA! 🔴\n\n${nombre} ha activado el botón de PELIGRO INMEDIATO.\nNecesita ayuda URGENTE.`;
                    } else if (tipoMsg === 'medical') {
                        mensaje = `🟠 EMERGENCIA MÉDICA 🟠\n\n${nombre} necesita asistencia médica URGENTE.`;
                    } else if (tipoMsg === 'warning') {
                        mensaje = `🟡 SITUACIÓN SOSPECHOSA 🟡\n\n${nombre} activó el botón de aviso.\nPor favor contactarse.`;
                    }
                    if (ubicacionUrl) {
                        mensaje += `\n\n📍 Ubicación:\n${ubicacionUrl}`;
                    } else {
                        mensaje += `\n\n⚠️ No se pudo obtener ubicación. Por favor llamar para coordinar.`;
                    }
                    // Abrir grupo con mensaje preescrito
                    window.open(`${grupoLink}?text=${encodeURIComponent(mensaje)}`, "_blank");
                    return true;
                };

                // Función para obtener ubicación y luego enviar al grupo
                const obtenerUbicacionYEnviarGrupo = (tipoMsg) => {
                    navigator.geolocation.getCurrentPosition(p => {
                        const url = `https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`;
                        enviarMensajeGrupo(tipoMsg, url);
                    }, () => {
                        enviarMensajeGrupo(tipoMsg, "");
                    }, { enableHighAccuracy: true, timeout: 8000 });
                };

                // Caso PELIGRO INMEDIATO (rojo)
                if (tipo === 'danger') {
                    call('101');
                    document.getElementById('sos-overlay').style.display = 'flex';
                    document.getElementById('sos-status-text').innerHTML = "🔴 Llamando a POLICÍA (101)...";
                    if (tieneGrupo) {
                        obtenerUbicacionYEnviarGrupo('danger');
                    }
                    setTimeout(() => { document.getElementById('sos-overlay').style.display = 'none'; }, 3000);
                }
                // Caso EMERGENCIA MÉDICA (naranja)
                else if (tipo === 'medical') {
                    let numEmergencia = localStorage.getItem('acc_emergencia_medica') || "107";
                    numEmergencia = limpiarNumero(numEmergencia);
                    if (!numEmergencia) numEmergencia = "107";
                    call(numEmergencia);
                    document.getElementById('sos-overlay').style.display = 'flex';
                    document.getElementById('sos-status-text').innerHTML = "🟠 Llamando a EMERGENCIA MÉDICA...";
                    if (tieneGrupo) {
                        obtenerUbicacionYEnviarGrupo('medical');
                    }
                    setTimeout(() => { document.getElementById('sos-overlay').style.display = 'none'; }, 3000);
                }
                // Caso SITUACIÓN SOSPECHOSA (amarillo)
                else if (tipo === 'warning') {
                    // Si hay grupo, enviamos mensaje inmediatamente (sin esperar llamada)
                    if (tieneGrupo) {
                        obtenerUbicacionYEnviarGrupo('warning');
                        // Luego hacemos la llamada al contacto principal
                        if (contactoPrincipal && validarNumero(contactoPrincipal)) {
                            const numeroLimpio = limpiarNumero(contactoPrincipal);
                            call(numeroLimpio);
                            document.getElementById('sos-overlay').style.display = 'flex';
                            document.getElementById('sos-status-text').innerHTML = `🟡 Llamando a ${numeroLimpio}... (mensaje ya enviado al grupo)`;
                            setTimeout(() => { document.getElementById('sos-overlay').style.display = 'none'; }, 4000);
                        } else {
                            alert("⚠️ No hay contacto principal configurado.");
                        }
                    } else {
                        // Sin grupo: llamar, esperar y luego enviar WhatsApp al contacto principal
                        if (!contactoPrincipal || !validarNumero(contactoPrincipal)) {
                            alert("⚠️ No hay contacto principal configurado. Configurá un contacto en Ajustes.");
                            return;
                        }
                        const numeroLimpio = limpiarNumero(contactoPrincipal);
                        call(numeroLimpio);
                        document.getElementById('sos-overlay').style.display = 'flex';
                        document.getElementById('sos-status-text').innerHTML = `🟡 Llamando a ${numeroLimpio}... Esperando respuesta ${tiempoEspera} segundos.`;
                        
                        // Esperar y enviar WhatsApp si no atiende
                        setTimeout(() => {
                            const mensajeBase = `🟡 AVISO DE SITUACIÓN SOSPECHOSA\n\n${nombre} activó el botón de pánico.\nNo pudo comunicarse por teléfono. Por favor contactarse URGENTE.`;
                            navigator.geolocation.getCurrentPosition(p => {
                                const url = `https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`;
                                const mensaje = `${mensajeBase}\n\n📍 Ubicación:\n${url}`;
                                window.open(`https://wa.me/549${numeroLimpio}?text=${encodeURIComponent(mensaje)}`, "_blank");
                            }, () => {
                                const mensaje = `${mensajeBase}\n\n⚠️ No se pudo obtener ubicación. Por favor llamar para coordinar.`;
                                window.open(`https://wa.me/549${numeroLimpio}?text=${encodeURIComponent(mensaje)}`, "_blank");
                            }, { enableHighAccuracy: true, timeout: 8000 });
                            document.getElementById('sos-status-text').innerHTML = "✅ Mensaje enviado.";
                            setTimeout(() => { document.getElementById('sos-overlay').style.display = 'none'; }, 3000);
                        }, tiempoEspera * 1000);
                    }
                }
                // Cerrar menú
                const menu = document.getElementById('panic-menu');
                if (menu) menu.classList.add('hidden');
                menuAbierto = false;
            });
        }

        // ==================== INICIALIZACIÓN DE EVENTOS ====================
        function configurarPanico() {
            const panicCircle = document.getElementById('panic-circle');
            if (panicCircle) {
                panicCircle.addEventListener('touchstart', startPanicPress);
                panicCircle.addEventListener('touchend', endPanicPress);
                panicCircle.addEventListener('mousedown', startPanicPress);
                panicCircle.addEventListener('mouseup', endPanicPress);
            }
            const panicCancel = document.querySelector('.panic-cancel');
            if (panicCancel) {
                panicCancel.onclick = () => {
                    const menu = document.getElementById('panic-menu');
                    if (menu) menu.classList.add('hidden');
                    menuAbierto = false;
                };
            }
            const panicOptions = document.querySelectorAll('.panic-option');
            panicOptions.forEach(opt => {
                opt.onclick = () => {
                    const type = opt.getAttribute('data-type');
                    activarPanico(type);
                };
            });
        }

        // ... (resto de funciones: guardarConfigRemis, etc., igual que antes) ...

        // Asegurarse de llamar a configurarPanico() en DOMContentLoaded
        document.addEventListener('DOMContentLoaded', function() {
            // ... (código anterior de términos y botón atrás) ...
            configurarPanico();
        });
    </script>
</body>
</html>
