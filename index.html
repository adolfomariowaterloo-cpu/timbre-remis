<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acción - Timbre Remis</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#111;
  text-align:center;
  color:white;
}

.logo img{
  width:180px;
  margin-top:20px;
}

h1{
  margin:10px 0 20px 0;
  font-size:26px;
}

.boton{
  display:block;
  width:85%;
  margin:15px auto;
  padding:20px;
  font-size:20px;
  border-radius:12px;
  border:none;
  color:white;
  cursor:pointer;
}

.casa{ background:#c40000; }
.trabajo{ background:#900000; }
.otros{ background:#333; }
.config{ background:#555; font-size:16px; }

input{
  width:80%;
  padding:10px;
  margin:10px;
  font-size:16px;
}
</style>
</head>

<body>

<div class="logo">
  <img src="logo.png">
</div>

<h1>Timbre Remis</h1>

<div id="principal">
  <button class="boton casa" onclick="enviarDireccion('casa')">
    Casa 🏡
  </button>

  <button class="boton trabajo" onclick="enviarDireccion('trabajo')">
    Trabajo 🛠️
  </button>

  <button class="boton otros" onclick="enviarUbicacion()">
    Otros 🗺️ (Ubicación actual)
  </button>

  <button class="boton config" onclick="configurar()">
    ⚙ Configurar / Cambiar datos
  </button>
</div>

<script>

let numero = "5493442641200";

function pedirNombre(){
  let nombre = localStorage.getItem("nombre");
  if(!nombre){
    nombre = prompt("Ingrese su nombre:");
    if(nombre){
      localStorage.setItem("nombre", nombre);
    }
  }
  return nombre;
}

function enviarDireccion(tipo){
  let direccion = localStorage.getItem(tipo);
  if(!direccion){
    direccion = prompt("Ingrese la dirección para " + tipo + ":");
    if(direccion){
      localStorage.setItem(tipo, direccion);
    } else {
      return;
    }
  }

  let nombre = pedirNombre();
  if(!nombre) return;

  let mensaje = encodeURIComponent(
    "Acción 🚗\nNombre: " + nombre +
    "\nDirección: " + direccion
  );

  window.location.href = "https://wa.me/" + numero + "?text=" + mensaje;
}

function enviarUbicacion(){
  let nombre = pedirNombre();
  if(!nombre) return;

  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(function(pos){
      let lat = pos.coords.latitude;
      let lon = pos.coords.longitude;
      let mensaje = encodeURIComponent(
        "Acción 🚗\nNombre: " + nombre +
        "\nUbicación: https://maps.google.com/?q=" + lat + "," + lon
      );
      window.location.href = "https://wa.me/" + numero + "?text=" + mensaje;
    });
  }
}

function configurar(){
  localStorage.clear();
  alert("Datos borrados. Se volverán a pedir al usar los botones.");
}

</script>

</body>
</html>
