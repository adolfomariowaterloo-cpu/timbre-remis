<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timbre Remis</title>

<style>
body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#1f1f1f;
color:white;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
height:100vh;
text-align:center;
}

.logo{
width:120px;
margin-bottom:10px;
}

h1{
margin-bottom:20px;
}

.boton{
width:85%;
max-width:400px;
padding:18px;
margin:10px 0;
font-size:20px;
border:none;
border-radius:15px;
background:linear-gradient(45deg,#a00000,#ff1a1a);
color:white;
}

.boton-gris{
width:85%;
max-width:400px;
padding:18px;
margin:10px 0;
font-size:18px;
border:none;
border-radius:15px;
background:#3a3a3a;
color:white;
}

.config{
position:fixed;
bottom:20px;
right:20px;
width:55px;
height:55px;
border-radius:50%;
border:none;
background:#555;
color:white;
font-size:20px;
}

.tarifa{
margin-top:10px;
font-size:14px;
background:#2f2f2f;
color:white;
border:none;
padding:10px 20px;
border-radius:20px;
}

.mensaje{
margin-top:15px;
font-size:16px;
color:#ccc;
}
</style>
</head>

<body>

<img src="logo.png" class="logo">
<h1>Timbre Remis</h1>

<button class="boton" onclick="pedir('casa')">🏡 Casa</button>
<button class="boton" onclick="pedir('trabajo')">🛠️ Trabajo</button>
<button class="boton" onclick="pedir('favorito')">⭐ Favorito</button>
<button class="boton-gris" onclick="pedir('mapa')">🗺️ Ubicación actual</button>

<button class="tarifa" onclick="pedirTarifa()">💲 Tarifa estimada</button>

<div class="mensaje" id="mensaje"></div>

<button class="config" onclick="configurar()">⚙</button>

<script>

const numeroEmpresa = "3442641200";
let ultimaDireccion = "";

function pedir(tipo){

let direccion = localStorage.getItem(tipo);

if(tipo !== "mapa" && !direccion){
direccion = prompt("Ingresá la dirección para " + tipo + ":");
if(!direccion) return;
localStorage.setItem(tipo, direccion);
}

if(tipo === "mapa"){
direccion = "Te envío mi ubicación actual";
}

ultimaDireccion = direccion;

let texto = "Hola, quiero pedir un remis desde " + direccion;

document.getElementById("mensaje").innerText = "Avisando a Acción...";

setTimeout(function(){
window.location.href = "https://wa.me/549" + numeroEmpresa + "?text=" + encodeURIComponent(texto);
},1000);

}

function pedirTarifa(){

if(!ultimaDireccion){
alert("Primero elegí desde dónde salís.");
return;
}

let destino = prompt("Ingresá dirección de destino:");
if(!destino) return;

let texto = "Hola, quiero saber la tarifa desde " + ultimaDireccion + " hasta " + destino;

window.location.href = "https://wa.me/549" + numeroEmpresa + "?text=" + encodeURIComponent(texto);

}

function configurar(){

let casa = prompt("Dirección Casa:", localStorage.getItem("casa") || "");
if(casa !== null) localStorage.setItem("casa", casa);

let trabajo = prompt("Dirección Trabajo:", localStorage.getItem("trabajo") || "");
if(trabajo !== null) localStorage.setItem("trabajo", trabajo);

let favorito = prompt("Dirección Favorito:", localStorage.getItem("favorito") || "");
if(favorito !== null) localStorage.setItem("favorito", favorito);

alert("Datos guardados");

}

</script>

</body>
</html>
