<!DOCTYPE html>
<html lang="es">
<head>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Timbre Acción Remises</title>

<style>

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#000;
color:white;
text-align:center;
}

header{
padding:20px;
}

header img{
width:150px;
}

.container{
padding:20px;
}

button{

width:90%;
max-width:420px;

margin:12px auto;

padding:18px;

font-size:20px;

border:none;

border-radius:18px;

cursor:pointer;

display:block;

color:white;

font-weight:bold;

}

.remis{background:#c40000;}

.emergencia{background:#ff0000;}

.util{background:#0066cc;}

.eventos{background:#e1306c;}

.farmacia{background:#009933;}

.servicios{background:#ff9900;}

.servicioItem{background:#444;}

.volver{background:#555;}

.guardar{background:#28a745;}

.hidden{display:none;}

input{

width:85%;

padding:10px;

margin:6px;

border-radius:8px;

border:none;

}

#botonPanico{

position:fixed;

bottom:20px;

right:20px;

width:90px;

height:90px;

border-radius:50%;

background:red;

display:flex;

align-items:center;

justify-content:center;

font-weight:bold;

}

</style>
</head>


<body>

<header>

<img src="logo.png">

<h2>Timbre Acción Remises</h2>

</header>



<div class="container" id="menuPrincipal">

<button class="remis" onclick="abrirMenu('menuRemis')">
PEDIR REMIS
</button>

<button class="emergencia" onclick="abrirMenu('menuEmergencias')">
TELÉFONOS DE EMERGENCIA
</button>

<button class="util" onclick="abrirMenu('menuUtiles')">
TELÉFONOS ÚTILES
</button>

<button class="servicios" onclick="abrirMenu('menuServicios')">
CONTRATACIÓN DE SERVICIOS
</button>

<button class="farmacia"
onclick="window.open('https://www.elmiercolesdigital.com.ar/servicios/farmacias-de-turno/','_blank')">
FARMACIAS DE TURNO
</button>

<button class="eventos"
onclick="window.open('https://www.instagram.com/eventos.cdelu/','_blank')">
EVENTOS
</button>

<button onclick="abrirMenu('menuConfiguracion')">
CONFIGURACIÓN
</button>

</div>



<div class="container hidden" id="menuRemis">

<button onclick="pedirRemis('casa')" id="btnCasa">
CASA
</button>

<button onclick="pedirRemis('trabajo')" id="btnTrabajo">
TRABAJO
</button>

<button onclick="pedirRemis('favorito')" id="btnFavorito">
FAVORITO
</button>

<button onclick="pedirRemis('ubicacion')">
MI UBICACIÓN
</button>

<button class="volver" onclick="volver()">
VOLVER
</button>

</div>



<div class="container hidden" id="menuEmergencias">

<button onclick="window.location.href='tel:911'">
POLICÍA 911
</button>

<button onclick="window.location.href='tel:107'">
AMBULANCIA 107
</button>

<button onclick="window.location.href='tel:100'">
BOMBEROS 100
</button>

<button onclick="window.location.href='tel:3442660877'">
VIDA EMERGENCIAS
</button>

<button onclick="window.location.href='tel:424242'">
CÍRCULO CATÓLICO
</button>

<button class="volver" onclick="volver()">
VOLVER
</button>

</div>



<div class="container hidden" id="menuUtiles">

<button onclick="window.location.href='tel:103'">
DEFENSA CIVIL
</button>

<button onclick="window.location.href='tel:102'">
NIÑEZ
</button>

<button class="volver" onclick="volver()">
VOLVER
</button>

</div>



<div class="container hidden" id="menuServicios">

<button class="servicioItem" onclick="llamarServicio('mecanico')">AUXILIO MECÁNICO</button>

<button class="servicioItem" onclick="llamarServicio('limpieza')">LIMPIEZA</button>

<button class="servicioItem" onclick="llamarServicio('plomeria')">PLOMERÍA</button>

<button class="servicioItem" onclick="llamarServicio('electricidad')">ELECTRICIDAD</button>

<button class="servicioItem" onclick="llamarServicio('gasista')">GASISTA</button>

<button class="servicioItem" onclick="llamarServicio('albanil')">ALBAÑILERÍA</button>

<button class="servicioItem" onclick="llamarServicio('pintor')">PINTOR</button>

<button class="servicioItem" onclick="llamarServicio('carpintero')">CARPINTERO</button>

<button class="servicioItem" onclick="llamarServicio('jardin')">JARDINERÍA / PASTO</button>

<button class="servicioItem" onclick="llamarServicio('costurera')">COSTURERA</button>

<button class="servicioItem" onclick="llamarServicio('estetica')">ESTÉTICA</button>

<button class="volver" onclick="volver()">
VOLVER
</button>

</div>



<div class="container hidden" id="menuConfiguracion">

<h3>DATOS</h3>

<input id="nombre" placeholder="Tu nombre">

<h3>DOMICILIOS</h3>

<input id="casa" placeholder="Dirección Casa">

<input id="trabajo" placeholder="Dirección Trabajo">

<input id="favorito" placeholder="Dirección Favorito">

<button class="guardar" onclick="guardar()">
GUARDAR
</button>

<button class="volver" onclick="volver()">
VOLVER
</button>

</div>



<button id="botonPanico" onclick="alertaPanico()">
PANICO
</button>



<script>

function abrirMenu(menu){

document.getElementById("menuPrincipal").classList.add("hidden")

document.getElementById(menu).classList.remove("hidden")

if(menu=="menuRemis"){

actualizarDirecciones()

}

}

function volver(){

document.querySelectorAll(".container").forEach(m=>{
m.classList.add("hidden")
})

document.getElementById("menuPrincipal").classList.remove("hidden")

}



function actualizarDirecciones(){

let casa=localStorage.getItem("casa")||""

let trabajo=localStorage.getItem("trabajo")||""

let favorito=localStorage.getItem("favorito")||""

document.getElementById("btnCasa").innerText="CASA "+casa

document.getElementById("btnTrabajo").innerText="TRABAJO "+trabajo

document.getElementById("btnFavorito").innerText="FAVORITO "+favorito

}



function pedirRemis(tipo){

let nombre=localStorage.getItem("nombre")||""

let dir=localStorage.getItem(tipo)||""

if(tipo=="ubicacion"){

navigator.geolocation.getCurrentPosition(function(pos){

dir="https://maps.google.com/?q="+pos.coords.latitude+","+pos.coords.longitude

enviarRemis(nombre,dir)

})

}else{

enviarRemis(nombre,dir)

}

}



function enviarRemis(nombre,dir){

let numero="543442000000"

let texto="Hola soy "+nombre+" necesito un remis en "+dir

window.open("https://wa.me/"+numero+"?text="+encodeURIComponent(texto))

}



function guardar(){

document.querySelectorAll("input").forEach(c=>{

localStorage.setItem(c.id,c.value)

})

}



window.onload=function(){

document.querySelectorAll("input").forEach(c=>{

c.value=localStorage.getItem(c.id)||""

})

}



function alertaPanico(){

alert("BOTON DE PANICO ACTIVADO")

}

</script>

</body>
</html>
