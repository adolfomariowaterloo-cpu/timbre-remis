```html
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Acción Remis</title>

<style>

body{
margin:0;
font-family:Arial;
background:#184c3a;
text-align:center;
color:white;
}

header{
background:#c40000;
padding:18px;
font-size:30px;
font-weight:bold;
}

.container{
padding:20px;
}

button{
width:90%;
max-width:420px;
margin:12px auto;
padding:20px;
font-size:22px;
border:none;
border-radius:40px;
cursor:pointer;
display:block;
font-weight:bold;
color:white;
box-shadow:0 6px 0 rgba(0,0,0,0.4);
}

.timbre{
background:linear-gradient(#ffe34d,#ffbf00);
color:black;
font-size:26px;
padding:35px;
}

.emergencia{
background:linear-gradient(#ff3a3a,#a80000);
}

.farmacia{
background:linear-gradient(#1fa64a,#0d6e2b);
}

.telefonos{
background:linear-gradient(#3c7edb,#1f4c8f);
}

.eventos{
background:linear-gradient(#8a4edb,#4a2a8f);
}

.small{
font-size:15px;
margin-top:6px;
}

.hidden{
display:none;
}

.volver{
margin-top:25px;
font-size:18px;
color:#ddd;
cursor:pointer;
}

input{
width:85%;
padding:10px;
margin:8px;
border-radius:10px;
border:none;
}

</style>

</head>

<body>

<header>
ACCIÓN REMIS
</header>


<div class="container" id="principal">

<button class="timbre" onclick="abrirOpcionesRemis()">
🔔 TOCAR TIMBRE ACCIÓN
<div class="small">Tocar para pedir un remis</div>
</button>

<button class="emergencia" onclick="abrirEmergencias()">
🚨 EMERGENCIAS
</button>

<button class="farmacia" onclick="abrirFarmacia()">
💊 FARMACIA DE TURNO
</button>

<button class="telefonos" onclick="abrirTelefonos()">
📞 TELÉFONOS ÚTILES
</button>

<button class="eventos" onclick="abrirEventos()">
🎭 EVENTOS
</button>

</div>



<div class="container hidden" id="opcionesRemis">

<h2>¿Desde dónde pedís el remis?</h2>

<button onclick="pedirDesde('Casa')">🏠 Casa</button>

<button onclick="pedirDesde('Trabajo')">🏢 Trabajo</button>

<button onclick="pedirUbicacion()">📍 Ubicación actual</button>

<button onclick="abrirConfig()">⚙ Configuración</button>

<div class="volver" onclick="volverInicio()">⬅ Volver</div>

</div>



<div class="container hidden" id="pantallaEmergencias">

<h2>Emergencias</h2>

<button onclick="window.location.href='tel:101'">🚓 Policía</button>

<button onclick="window.location.href='tel:100'">🚒 Bomberos</button>

<button onclick="window.location.href='tel:107'">🚑 Ambulancia</button>

<div class="volver" onclick="volverInicio()">⬅ Volver</div>

</div>



<div class="container hidden" id="pantallaTelefonos">

<h2>Teléfonos útiles</h2>

<button onclick="window.location.href='tel:107'">Hospital</button>

<button onclick="window.location.href='tel:03442420000'">Terminal</button>

<button onclick="window.location.href='tel:03442430000'">Municipalidad</button>

<button onclick="window.location.href='tel:03442440000'">Turismo</button>

<button onclick="window.location.href='tel:03442411111'">Mida</button>

<button onclick="window.location.href='tel:03442422222'">Emergencia Médica</button>

<button onclick="window.location.href='tel:03442433333'">Círculo Católico</button>

<button onclick="window.location.href='tel:03442444444'">Alerta</button>

<div class="volver" onclick="volverInicio()">⬅ Volver</div>

</div>



<div class="container hidden" id="configuracion">

<h2>Configuración</h2>

<input type="text" id="apellido" placeholder="Apellido">

<input type="text" id="dirCasa" placeholder="Dirección Casa">
<input type="text" id="dirTrabajo" placeholder="Dirección Trabajo">

<button onclick="guardarConfig()">Guardar</button>

<div class="volver" onclick="volverInicio()">⬅ Volver</div>

</div>



<script>

const telefonoEmpresa="5493442641200";

function abrirOpcionesRemis(){

document.getElementById("principal").classList.add("hidden");
document.getElementById("opcionesRemis").classList.remove("hidden");

}

function abrirEmergencias(){

document.getElementById("principal").classList.add("hidden");
document.getElementById("pantallaEmergencias").classList.remove("hidden");

}

function abrirTelefonos(){

document.getElementById("principal").classList.add("hidden");
document.getElementById("pantallaTelefonos").classList.remove("hidden");

}

function abrirConfig(){

document.getElementById("opcionesRemis").classList.add("hidden");
document.getElementById("configuracion").classList.remove("hidden");

}

function volverInicio(){

document.getElementById("principal").classList.remove("hidden");

document.getElementById("opcionesRemis").classList.add("hidden");
document.getElementById("pantallaEmergencias").classList.add("hidden");
document.getElementById("pantallaTelefonos").classList.add("hidden");
document.getElementById("configuracion").classList.add("hidden");

}

function pedirDesde(tipo){

let direccion="";

if(tipo=="Casa") direccion=localStorage.getItem("dirCasa");
if(tipo=="Trabajo") direccion=localStorage.getItem("dirTrabajo");

const apellido=localStorage.getItem("apellido")||"Cliente";

enviarWhatsApp(apellido,direccion);

}

function pedirUbicacion(){

navigator.geolocation.getCurrentPosition(function(pos){

const lat=pos.coords.latitude;
const lon=pos.coords.longitude;

const link="https://maps.google.com/?q="+lat+","+lon;

const apellido=localStorage.getItem("apellido")||"Cliente";

enviarWhatsApp(apellido,link);

});

}

function enviarWhatsApp(apellido,origen){

const mensaje="Hola, soy "+apellido+". Enviame un móvil a: "+origen;

const url="https://wa.me/"+telefonoEmpresa+"?text="+encodeURIComponent(mensaje);

window.location.href=url;

}

function guardarConfig(){

localStorage.setItem("apellido",document.getElementById("apellido").value);
localStorage.setItem("dirCasa",document.getElementById("dirCasa").value);
localStorage.setItem("dirTrabajo",document.getElementById("dirTrabajo").value);

alert("Configuración guardada");

}

function abrirFarmacia(){

window.open("https://www.elmiercolesdigital.com.ar/servicios/farmacias-de-turno/","_blank");

}

function abrirEventos(){

window.open("https://www.instagram.com/eventos.cdelu/","_blank");

}

</script>

</body>
</html>
```
