<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de Precio</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f4f4;
    text-align: center;
    padding: 20px;
}

h2 {
    margin-bottom: 20px;
}

.opcion {
    display: block;
    margin: 10px auto;
    padding: 15px;
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,0.25);
    transition: 0.2s;
}

.opcion:hover {
    transform: scale(1.03);
}

/* Jerarquía visual */
.casa {
    width: 100%;
    background: linear-gradient(145deg, #ff3b3b, #c40000);
}

.trabajo {
    width: 90%;
    background: linear-gradient(145deg, #800020, #4b0012);
}

.favorito {
    width: 80%;
    background: linear-gradient(145deg, #ff8c00, #cc6a00);
}

.ubicacion {
    width: 70%;
    background: linear-gradient(145deg, #1e90ff, #005bbb);
}

input {
    margin-top: 15px;
    padding: 10px;
    width: 90%;
    border-radius: 8px;
    border: 1px solid #ccc;
}

#confirmacion {
    margin-top: 20px;
    font-weight: bold;
}
</style>
</head>

<body>

<h2>¿Desde dónde salís?</h2>

<button class="opcion casa" onclick="seleccionarOrigen('Casa')">Casa</button>
<button class="opcion trabajo" onclick="seleccionarOrigen('Trabajo')">Trabajo</button>
<button class="opcion favorito" onclick="seleccionarOrigen('Favorito')">Favorito</button>
<button class="opcion ubicacion" onclick="mostrarInput()">Otra ubicación</button>

<div id="inputDireccion" style="display:none;">
    <input type="text" id="direccionManual" placeholder="Escribí la dirección">
</div>

<div id="confirmacion"></div>

<script>
let origen = "";

function seleccionarOrigen(tipo) {
    origen = tipo;
    document.getElementById("confirmacion").innerHTML =
        "Origen seleccionado: " + origen + "<br><br>Ahora elegir destino.";
}

function mostrarInput() {
    document.getElementById("inputDireccion").style.display = "block";
}
</script>

</body>
</html>
