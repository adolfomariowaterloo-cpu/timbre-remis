<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timbre Remis</title>

<link rel="manifest" href="manifest.json">

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:black;
    color:white;
    text-align:center;
}

h1{
    margin-top:20px;
}

.logo{
    width:140px;
    margin-top:20px;
}

.boton{
    display:block;
    width:85%;
    margin:15px auto;
    padding:18px;
    font-size:18px;
    border-radius:12px;
    border:none;
    background:#c40000;
    color:white;
}

.boton:active{
    background:#ff0000;
}

.mensaje{
    margin-top:20px;
    font-size:16px;
}
</style>
</head>

<body>

<img src="logo.png" class="logo">

<h1>Timbre Remis</h1>

<button class="boton" onclick="enviarDireccion('Casa', localStorage.getItem('casa'))">
🏡 Casa
</button>

<button class="boton" onclick="enviarDireccion('Trabajo', localStorage.getItem('trabajo'))">
🛠️ Trabajo
</button>

<button class="boton" onclick="enviarDireccion('Favorito', localStorage.getItem('favorito'))">
⭐ Favorito
</button>

<button class="boton" onclick="ubicacionActual()">
🗺️ Otro lugar (ubicación actual)
</button>

<p class="mensaje" id="mensaje"></p>

<script>

const telefonoEmpresa = "5493442641200";

function configurar(){
    if(!localStorage.getItem('casa')){
        let casa = prompt("Ingrese dirección de CASA (ej: Urquiza 465)");
        if(casa) localStorage.setItem('casa', casa);
    }

    if(!localStorage.getItem('trabajo')){
        let trabajo = prompt("Ingrese dirección de TRABAJO (ej: Belgrano 674)");
        if(trabajo) localStorage.setItem('trabajo', trabajo);
    }

    if(!localStorage.getItem('favorito')){
        let fav = confirm("¿Desea agregar un lugar FAVORITO?");
        if(fav){
            let favorito = prompt("Ingrese dirección FAVORITO");
            if(favorito) localStorage.setItem('favorito', favorito);
        }
    }
}

function enviarDireccion(tipo, direccion){
    if(!direccion){
        alert("No configurado aún.");
        return;
    }

    let mensaje = "Hola, necesito un remis desde:\n" + direccion;

    let url = "https://wa.me/" + telefonoEmpresa + "?text=" + encodeURIComponent(mensaje);

    document.getElementById("mensaje").innerText = "Pedido enviado";

    setTimeout(() => {
        window.location.href = url;
    }, 800);

    setTimeout(() => {
        window.close();
    }, 3000);
}

function ubicacionActual(){
    if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(function(pos){
            let lat = pos.coords.latitude;
            let lon = pos.coords.longitude;

            let mensaje = "Hola, necesito un remis desde mi ubicación:\nhttps://maps.google.com/?q=" + lat + "," + lon;

            let url = "https://wa.me/" + telefonoEmpresa + "?text=" + encodeURIComponent(mensaje);

            document.getElementById("mensaje").innerText = "Pedido enviado";

            setTimeout(() => {
                window.location.href = url;
            }, 800);

            setTimeout(() => {
                window.close();
            }, 3000);

        });
    }else{
        alert("El celular no permite ubicación.");
    }
}

configurar();

</script>

</body>
</html>
