<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Timbre Remis</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #000;
      color: white;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    img {
      width: 140px;
      margin-bottom: 10px;
    }

    .frase {
      font-size: 18px;
      margin-bottom: 30px;
      opacity: 0.9;
    }

    button {
      width: 80%;
      max-width: 350px;
      height: 90px;
      font-size: 26px;
      border: none;
      border-radius: 12px;
      background-color: black;
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(255,255,255,0.2);
    }

    button.accion {
      background-color: red;
    }

    .mensaje {
      margin-top: 25px;
      font-size: 20px;
    }

    .oculto {
      display: none;
    }
  </style>
</head>
<body>

  <img src="logo.png" alt="Logo">

  <div class="frase">
    Tu remis de confianza
  </div>

  <button id="btn">TIMBRE REMIS</button>

  <div class="mensaje oculto" id="confirmacion">
    <strong>PEDIDO ENVIADO</strong><br>
    Estamos en contacto por WhatsApp
  </div>

  <script>
    const telefonoEmpresa = "5493442641200";
    const btn = document.getElementById("btn");
    const confirmacion = document.getElementById("confirmacion");

    btn.addEventListener("click", () => {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {

          const lat = pos.coords.latitude;
          const lon = pos.coords.longitude;

          const texto = `Hola, solicito un remis.\nUbicación: https://maps.google.com/?q=${lat},${lon}`;
          const url = `https://wa.me/${telefonoEmpresa}?text=${encodeURIComponent(texto)}`;

          // Cambio visual inmediato
          btn.classList.add("accion");
          btn.innerText = "ACCIÓN";

          setTimeout(() => {
            btn.classList.add("oculto");
            confirmacion.classList.remove("oculto");
          }, 800);

          window.location.href = url;

        }, () => {
          alert("No se pudo obtener la ubicación.");
        });
      } else {
        alert("Tu dispositivo no permite ubicación.");
      }
    });
  </script>

</body>
</html>
