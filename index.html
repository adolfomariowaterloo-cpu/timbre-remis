<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solicitud de Móvil</title>

<style>

body{
    margin:0;
    font-family:Arial, Helvetica, sans-serif;
    background:#000;
    color:white;
    display:flex;
    flex-direction:column;
    align-items:center;
}

h1{
    margin-top:20px;
}

.contenedor{
    width:90%;
    max-width:400px;
    margin-top:30px;
}

button{
    width:100%;
    padding:18px;
    margin:12px 0;
    border:none;
    border-radius:15px;
    font-size:18px;
    color:white;
    cursor:pointer;
    box-shadow:0 6px 0 rgba(0,0,0,0.6);
    transition:0.1s;
}

button:active{
    transform:translateY(4px);
    box-shadow:0 2px 0 rgba(0,0,0,0.6);
}

/* COLORES */

.casa{
    background:linear-gradient(to bottom, #ff4d4d, #b30000);
}

.trabajo{
    background:linear-gradient(to bottom, #800000, #4d0000);
}

.favorito{
    background:linear-gradient(to bottom, #ff9933, #cc6600);
}

.mapa{
    background:linear-gradient(to bottom, #3399ff, #0066cc);
}

.tarifa{
    background:linear-gradient(to bottom, #aaaaaa, #666666);
}

.config{
    width:60px;
    height:60px;
    border-radius:50%;
    background:linear-gradient(to bottom, #888, #444);
    font-size:24px;
    margin:30px auto;
}

</style>
</head>

<body>

<h1>Remis</h1>

<div class="contenedor">

<button class="casa" onclick="pedirAuto('casa')">Desde casa</button>

<button class="trabajo" onclick="pedirAuto('trabajo')">Desde el trabajo</button>

<button class="favorito" onclick="pedirAuto('favorito')">Desde favorito</button>

<button class="mapa" onclick="desdeOtra()">Desde otra ubicación</button>

<button class="tarifa" onclick="consultarTarifa()">Consultar tarifa</button>

<button class="config" onclick="configurar()">⚙</button>

</div>

<script>

const numero = "5493442641200";

/* GUARDAR Y OBTENER */

function guardar(tipo, direccion){
    localStorage.setItem(tipo, direccion);
}

function obtener(tipo){
    return localStorage.getItem(tipo);
}

/* PEDIR AUTO */

function pedirAuto(tipo){

    let direccion = obtener(tipo);

    if(!direccion){
        direccion = prompt("Ingresá la dirección de " + tipo);
        if(!direccion) return;
        guardar(tipo, direccion);
    }

    enviarWhatsApp("Solicito móvil desde " + direccion);
}

/* OTRA UBICACION */

function desdeOtra(){
    let direccion = prompt("Ingresá la dirección desde donde salís");
    if(!direccion) return;
    enviarWhatsApp("Solicito móvil desde " + direccion);
}

/* CONSULTA TARIFA SIMPLE */

function consultarTarifa(){

    let desde = prompt("Desde:");
    if(!desde) return;

    let hasta = prompt("Hasta:");
    if(!hasta) return;

    enviarWhatsApp("Consulta tarifa desde " + desde + " hasta " + hasta);
}

/* CONFIGURACION */

function configurar(){

    let opcion = prompt("Escribí: casa, trabajo o favorito para cambiar dirección");

    if(!opcion) return;

    if(opcion === "casa" || opcion === "trabajo" || opcion === "favorito"){
        let nueva = prompt("Nueva dirección para " + opcion);
        if(nueva){
            guardar(opcion, nueva);
            alert("Dirección actualizada");
        }
    }else{
        alert("Opción no válida");
    }
}

/* WHATSAPP */

function enviarWhatsApp(mensaje){
    const url = "https://wa.me/" + numero + "?text=" + encodeURIComponent(mensaje);
    window.open(url, "_blank");
}

</script>

</body>
</html>
