<!DOCTYPE html>
<html lang="es">
<head>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Timbre Remis</title>

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#000;
color:white;
text-align:center;
}

header{padding:20px;}
header img{width:160px;}
header h1{margin:10px 0;font-size:28px;}

.container{padding:20px;}

button{
width:90%;
max-width:420px;
margin:12px auto;
padding:18px;
font-size:20px;
border:none;
border-radius:18px;
cursor:pointer;
display:block;
color:white;
font-weight:bold;
box-shadow:0 6px 0 rgba(0,0,0,0.5);
}

button:active{
transform:translateY(4px);
box-shadow:0 2px 0 rgba(0,0,0,0.5);
}

.remis{background:linear-gradient(#ff2b2b,#b30000);}
.emergencia{background:linear-gradient(#ff0000,#7a0000);}
.util{background:linear-gradient(#0066cc,#003366);}
.eventos{background:linear-gradient(#e1306c,#833ab4);}
.farmacia{background:linear-gradient(#00c853,#007e33);}
.servicios{background:linear-gradient(#ff9800,#c66900);}
.volver{background:#444;}

input{
width:85%;
padding:10px;
margin:8px 0;
font-size:15px;
border-radius:8px;
border:none;
}

.guardar{background:#28a745;}
.hidden{display:none;}

</style>
</head>

<body>

<header>
<img src="logo.png">
<h1>Timbre Remis 🔔</h1>
</header>

<div class="container" id="menuPrincipal">

<button class="remis" onclick="abrirMenu('menuRemis')">Remis</button>

<button class="emergencia" onclick="abrirMenu('menuEmergencias')">
Teléfonos de Emergencia
</button>

<button class="util" onclick="abrirMenu('menuUtiles')">
Teléfonos Útiles
</button>

<button class="servicios" onclick="abrirMenu('menuServicios')">
Contratación de Servicios
</button>

<button class="farmacia" onclick="abrirFarmacia()">
Farmacias de Turno
</button>

<button class="eventos"
onclick="window.open('https://www.instagram.com/eventos.cdelu/','_blank')">
Eventos
</button>

</div>



<div class="container hidden" id="menuServicios">

<button onclick="llamarServicio('mecanico')">Auxilio Mecánico</button>
<button onclick="llamarServicio('limpieza')">Serv. Limpieza Casa/Oficina</button>
<button onclick="llamarServicio('plomeria')">Plomería</button>
<button onclick="llamarServicio('electricidad')">Electricidad Domiciliaria</button>
<button onclick="llamarServicio('estetica')">Estética Corporal</button>
<button onclick="llamarServicio('pasto')">Corte de Pasto</button>
<button onclick="llamarServicio('jardineria')">Jardinería</button>
<button onclick="llamarServicio('costurera')">Costurera Profesional</button>
<button onclick="llamarServicio('gasista')">Gasista</button>
<button onclick="llamarServicio('pintor')">Pintor de Casas</button>
<button onclick="llamarServicio('carpintero')">Carpintero</button>

<button class="volver" onclick="volverPrincipal()">Volver</button>

</div>



<div class="container hidden" id="configuracion">

<h3>Servicios</h3>

<input id="mecanico_nombre" placeholder="Auxilio Mecánico - Nombre">
<input id="mecanico_tel" placeholder="Auxilio Mecánico - Teléfono">

<input id="limpieza_nombre" placeholder="Limpieza - Nombre">
<input id="limpieza_tel" placeholder="Limpieza - Teléfono">

<input id="plomeria_nombre" placeholder="Plomería - Nombre">
<input id="plomeria_tel" placeholder="Plomería - Teléfono">

<input id="electricidad_nombre" placeholder="Electricidad - Nombre">
<input id="electricidad_tel" placeholder="Electricidad - Teléfono">

<input id="estetica_nombre" placeholder="Estética - Nombre">
<input id="estetica_tel" placeholder="Estética - Teléfono">

<input id="pasto_nombre" placeholder="Corte Pasto - Nombre">
<input id="pasto_tel" placeholder="Corte Pasto - Teléfono">

<input id="jardineria_nombre" placeholder="Jardinería - Nombre">
<input id="jardineria_tel" placeholder="Jardinería - Teléfono">

<input id="costurera_nombre" placeholder="Costurera - Nombre">
<input id="costurera_tel" placeholder="Costurera - Teléfono">

<input id="gasista_nombre" placeholder="Gasista - Nombre">
<input id="gasista_tel" placeholder="Gasista - Teléfono">

<input id="pintor_nombre" placeholder="Pintor - Nombre">
<input id="pintor_tel" placeholder="Pintor - Teléfono">

<input id="carpintero_nombre" placeholder="Carpintero - Nombre">
<input id="carpintero_tel" placeholder="Carpintero - Teléfono">

<button class="guardar" onclick="guardarServicios()">Guardar</button>

<button class="volver" onclick="volverPrincipal()">Volver</button>

</div>



<script>

function abrirMenu(menu){

document.getElementById("menuPrincipal").classList.add("hidden")

document.getElementById(menu).classList.remove("hidden")

}

function volverPrincipal(){

document.getElementById("menuPrincipal").classList.remove("hidden")

let menus=document.querySelectorAll(".container")

menus.forEach(m=>{
if(m.id!=="menuPrincipal"){
m.classList.add("hidden")
}
})

}

function abrirFarmacia(){

window.open("https://www.elmiercolesdigital.com.ar/servicios/farmacias-de-turno/","_blank")

}

function llamarServicio(tipo){

let tel=localStorage.getItem(tipo+"_tel")

if(tel){
window.location.href="tel:"+tel
}

}

function guardarServicios(){

let campos=[
"mecanico","limpieza","plomeria","electricidad","estetica",
"pasto","jardineria","costurera","gasista","pintor","carpintero"
]

campos.forEach(c=>{

localStorage.setItem(c+"_nombre",document.getElementById(c+"_nombre").value)

localStorage.setItem(c+"_tel",document.getElementById(c+"_tel").value)

})

}

window.onload=function(){

let campos=[
"mecanico","limpieza","plomeria","electricidad","estetica",
"pasto","jardineria","costurera","gasista","pintor","carpintero"
]

campos.forEach(c=>{

document.getElementById(c+"_nombre").value=localStorage.getItem(c+"_nombre")||""

document.getElementById(c+"_tel").value=localStorage.getItem(c+"_tel")||""

})

}

</script>

</body>
</html>
