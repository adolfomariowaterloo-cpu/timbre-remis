<!DOCTYPE html>
<html lang="es">
<head>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Timbre Remis</title>

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#000;
color:white;
text-align:center;
}

header{
padding:20px;
}

header img{
width:160px;
}

header h1{
margin:10px 0;
font-size:28px;
}

.container{
padding:20px;
}

button{
width:90%;
max-width:420px;
margin:12px auto;
padding:18px;
font-size:20px;
border:none;
border-radius:18px;
cursor:pointer;
display:block;
color:white;
font-weight:bold;
box-shadow:0 6px 0 rgba(0,0,0,0.5);
}

button:active{
transform:translateY(4px);
box-shadow:0 2px 0 rgba(0,0,0,0.5);
}

.casa{background:linear-gradient(#ff2b2b,#b30000);}
.trabajo{background:linear-gradient(#ff8c00,#cc5500);}
.favorito{background:linear-gradient(#9b59b6,#5e3370);}
.ubicacion{background:linear-gradient(#2a9df4,#0b5fa5);}
.config{background:#555;}

.remis{background:linear-gradient(#ff2b2b,#b30000);}
.emergencia{background:linear-gradient(#ff0000,#7a0000);}
.util{background:linear-gradient(#0066cc,#003366);}
.eventos{background:linear-gradient(#e1306c,#833ab4);}
.farmacia{background:linear-gradient(#00c853,#007e33);}
.servicios{background:linear-gradient(#00aaff,#006699);}
.volver{background:#444;}

input{
width:85%;
padding:10px;
margin:10px 0;
font-size:16px;
border-radius:8px;
border:none;
}

.guardar{
background:#28a745;
}

.small{
font-size:14px;
display:block;
margin-top:5px;
}

.hidden{display:none;}

#botonPanico{
position:fixed;
bottom:25px;
right:20px;
width:80px;
height:80px;
background:red;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 6px 0 rgba(0,0,0,0.5);
user-select:none;
-webkit-user-select:none;
}

#botonPanico:active{
transform:translateY(4px);
box-shadow:0 2px 0 rgba(0,0,0,0.5);
}

#textoSOS{
position:fixed;
bottom:110px;
right:28px;
font-weight:bold;
font-size:18px;
background:red;
color:white;
padding:4px 10px;
border-radius:6px;
}

#botonPanico.activo{
background:lime;
box-shadow:0 0 0 120px rgba(0,255,0,0.6);
}

/* INSTALAR APP */

#instalarApp{
position:fixed;
bottom:0;
left:0;
right:0;
background:#111;
padding:15px;
display:none;
}

#instalarApp button{
background:#28a745;
}

</style>
</head>

<body>

<header>
<img src="logo.png">
<h1>Timbre Remis 🔔</h1>
</header>

<div id="instalarApp">
<button onclick="instalarApp()">Instalar Acción Remis en tu celular</button>
</div>

<div class="container" id="menuPrincipal">

<button class="remis" onclick="abrirMenu('menuRemis')">Remis</button>

<button class="servicios" onclick="abrirMenu('menuServicios')">
Servicios Domiciliarios
</button>

<button class="emergencia" onclick="abrirMenu('menuEmergencias')">
Teléfonos de Emergencia
</button>

<button class="util" onclick="abrirMenu('menuUtiles')">
Teléfonos Útiles
</button>

<button class="farmacia" onclick="abrirFarmacia()">
Farmacias de Turno
</button>

<button class="eventos"
onclick="window.open('https://www.instagram.com/eventos.cdelu/','_blank')">
Eventos
</button>

</div>

<!-- TODO TU HTML SIGUE EXACTAMENTE IGUAL -->

<!-- (No se modificó nada de tus menús ni botones) -->

<script>

const telefonoEmpresa="5493442641200"

let panicoTimer=null

document.getElementById("botonPanico").addEventListener("touchstart",activarHold)
document.addEventListener("touchend",cancelarHold)

function activarHold(){

panicoTimer=setTimeout(()=>{

document.getElementById("botonPanico").classList.add("activo")

setTimeout(()=>{
document.getElementById("botonPanico").classList.remove("activo")
},3000)

document.getElementById("sirena").play()

enviarPanico()

},2000)

}

function cancelarHold(){
clearTimeout(panicoTimer)
}

function abrirMenu(menu){

document.getElementById("menuPrincipal").classList.add("hidden")
document.getElementById("menuRemis").classList.add("hidden")
document.getElementById("menuEmergencias").classList.add("hidden")
document.getElementById("menuUtiles").classList.add("hidden")
document.getElementById("menuServicios").classList.add("hidden")
document.getElementById("configuracion").classList.add("hidden")

document.getElementById(menu).classList.remove("hidden")

}

function volverPrincipal(){

document.getElementById("menuPrincipal").classList.remove("hidden")
document.getElementById("menuRemis").classList.add("hidden")
document.getElementById("menuEmergencias").classList.add("hidden")
document.getElementById("menuUtiles").classList.add("hidden")
document.getElementById("menuServicios").classList.add("hidden")
document.getElementById("configuracion").classList.add("hidden")

}

function llamar(numero){
window.location.href="tel:"+numero
}

function abrirFarmacia(){
window.open("https://www.elmiercolesdigital.com.ar/servicios/farmacias-de-turno/","_blank")
}

function pedirDesde(tipo){

const apellido=localStorage.getItem("apellido")

if(!apellido){
abrirMenu("configuracion")
return
}

let direccion=localStorage.getItem("dir"+tipo.charAt(0).toUpperCase()+tipo.slice(1))

if(!direccion){
abrirMenu("configuracion")
return
}

enviarWhatsApp(apellido,direccion)

}

function pedirUbicacion(){

const apellido=localStorage.getItem("apellido")

if(!apellido){
abrirMenu("configuracion")
return
}

navigator.geolocation.getCurrentPosition(function(pos){

const lat=pos.coords.latitude
const lon=pos.coords.longitude

const link="https://maps.google.com/?q="+lat+","+lon

enviarWhatsApp(apellido,link)

})

}

function enviarWhatsApp(apellido,origen){

const mensaje="Hola, soy "+apellido+". Enviame un móvil a --> "+origen

const url="whatsapp://send?phone="+telefonoEmpresa+"&text="+encodeURIComponent(mensaje)

window.location.href=url

}

/* INSTALAR APP */

let deferredPrompt

window.addEventListener("beforeinstallprompt",(e)=>{

e.preventDefault()

deferredPrompt=e

document.getElementById("instalarApp").style.display="block"

})

function instalarApp(){

document.getElementById("instalarApp").style.display="none"

deferredPrompt.prompt()

deferredPrompt.userChoice.then(()=>{

deferredPrompt=null

})

}

</script>

</body>
</html>
