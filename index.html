<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Acción Remis</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#0b3d2e;
color:white;
text-align:center;
}

header{
background:#c40000;
padding:15px;
font-size:28px;
font-weight:bold;
}

.container{
padding:20px;
}

button{
width:90%;
max-width:420px;
margin:12px auto;
padding:18px;
font-size:20px;
border:none;
border-radius:20px;
cursor:pointer;
display:block;
color:white;
font-weight:bold;
box-shadow:0 6px 0 rgba(0,0,0,0.4);
}

button:active{
transform:translateY(4px);
box-shadow:0 2px 0 rgba(0,0,0,0.4);
}

.timbre{
padding:35px;
font-size:26px;
background:linear-gradient(#ffe34d,#ffbf00);
color:#000;
border-radius:50px;
box-shadow:0 10px 0 #c99500;
}

.emergencia{
background:linear-gradient(#ff3a3a,#a80000);
}

.farmacia{
background:linear-gradient(#1fa64a,#0d6e2b);
}

.telefonos{
background:linear-gradient(#3c7edb,#1f4c8f);
}

.eventos{
background:linear-gradient(#8a4edb,#4a2a8f);
}

.casa{background:#c40000;}
.trabajo{background:#ff8c00;}
.favorito{background:#7a2bc4;}
.ubicacion{background:#1c86ee;}
.config{background:#555;}

.small{
font-size:14px;
display:block;
margin-top:6px;
}

.hidden{
display:none;
}

footer{
margin-top:40px;
font-size:14px;
opacity:0.8;
}

input{
width:85%;
padding:10px;
margin:8px;
border-radius:10px;
border:none;
}

</style>

</head>


<body>

<header>
ACCIÓN REMIS
</header>


<div class="container" id="principal">

<button class="timbre" onclick="abrirOpcionesRemis()">
🔔 TOCAR TIMBRE ACCIÓN
<div class="small">Tocar para pedir un remis</div>
</button>

<button class="emergencia" onclick="abrirEmergencias()">
🚨 EMERGENCIAS
</button>

<button class="farmacia" onclick="abrirFarmacia()">
💊 FARMACIA DE TURNO
</button>

<button class="telefonos" onclick="abrirTelefonos()">
📞 TELÉFONOS ÚTILES
</button>

<button class="eventos" onclick="abrirEventos()">
🎭 EVENTOS
</button>

</div>



<div class="container hidden" id="opcionesRemis">

<h2>¿Desde dónde pedís el remis?</h2>

<button class="casa" onclick="pedirDesde('Casa')">
🏠 Casa
<span class="small" id="dirCasaTexto"></span>
</button>

<button class="trabajo" onclick="pedirDesde('Trabajo')">
🏢 Trabajo
<span class="small" id="dirTrabajoTexto"></span>
</button>

<button class="favorito" onclick="pedirDesde('Favorito')">
⭐ Favorito
<span class="small" id="dirFavoritoTexto"></span>
</button>

<button class="ubicacion" onclick="pedirUbicacion()">
📍 Ubicación actual
</button>

<button class="config" onclick="abrirConfig()">
⚙ Configuración
</button>

<button onclick="volverInicio()">⬅ Volver</button>

</div>



<div class="container hidden" id="pantallaEmergencias">

<h2>Emergencias</h2>

<button onclick="window.location.href='tel:101'">
🚓 Policía
</button>

<button onclick="window.location.href='tel:100'">
🚒 Bomberos
</button>

<button onclick="window.location.href='tel:107'">
🚑 Ambulancia
</button>

<button onclick="volverInicio()">⬅ Volver</button>

</div>



<div class="container hidden" id="pantallaTelefonos">

<h2>Teléfonos útiles</h2>

<button onclick="window.location.href='tel:03442420000'">
Hospital
</button>

<button onclick="window.location.href='tel:03442430000'">
Terminal
</button>

<button onclick="window.location.href='tel:03442440000'">
Municipalidad
</button>

<button onclick="volverInicio()">⬅ Volver</button>

</div>



<div class="container hidden" id="configuracion">

<h2>Configuración</h2>

<input type="text" id="apellido" placeholder="Apellido">

<input type="text" id="dirCasa" placeholder="Dirección Casa">
<input type="text" id="dirTrabajo" placeholder="Dirección Trabajo">
<input type="text" id="dirFavorito" placeholder="Dirección Favorito">

<button class="config" onclick="guardarConfig()">Guardar</button>

<button onclick="volverInicio()">⬅ Volver</button>

</div>



<footer>
Acción Remis – Siempre cerca
</footer>



<script>

const telefonoEmpresa="5493442641200";

window.onload=function(){

document.getElementById("apellido").value=localStorage.getItem("apellido")||"";
document.getElementById("dirCasa").value=localStorage.getItem("dirCasa")||"";
document.getElementById("dirTrabajo").value=localStorage.getItem("dirTrabajo")||"";
document.getElementById("dirFavorito").value=localStorage.getItem("dirFavorito")||"";

actualizarTextos();

}

function actualizarTextos(){

document.getElementById("dirCasaTexto").innerText=localStorage.getItem("dirCasa")||"";
document.getElementById("dirTrabajoTexto").innerText=localStorage.getItem("dirTrabajo")||"";
document.getElementById("dirFavoritoTexto").innerText=localStorage.getItem("dirFavorito")||"";

}

function abrirOpcionesRemis(){

document.getElementById("principal").classList.add("hidden");
document.getElementById("opcionesRemis").classList.remove("hidden");

}

function abrirEmergencias(){

document.getElementById("principal").classList.add("hidden");
document.getElementById("pantallaEmergencias").classList.remove("hidden");

}

function abrirTelefonos(){

document.getElementById("principal").classList.add("hidden");
document.getElementById("pantallaTelefonos").classList.remove("hidden");

}

function abrirConfig(){

document.getElementById("opcionesRemis").classList.add("hidden");
document.getElementById("configuracion").classList.remove("hidden");

}

function volverInicio(){

document.getElementById("principal").classList.remove("hidden");

document.getElementById("opcionesRemis").classList.add("hidden");
document.getElementById("pantallaEmergencias").classList.add("hidden");
document.getElementById("pantallaTelefonos").classList.add("hidden");
document.getElementById("configuracion").classList.add("hidden");

}

function guardarConfig(){

localStorage.setItem("apellido",document.getElementById("apellido").value);
localStorage.setItem("dirCasa",document.getElementById("dirCasa").value);
localStorage.setItem("dirTrabajo",document.getElementById("dirTrabajo").value);
localStorage.setItem("dirFavorito",document.getElementById("dirFavorito").value);

actualizarTextos();

alert("Configuración guardada");

}

function pedirDesde(tipo){

let direccion=localStorage.getItem("dir"+tipo);

const apellido=localStorage.getItem("apellido")||"Cliente";

enviarWhatsApp(apellido,direccion);

}

function pedirUbicacion(){

navigator.geolocation.getCurrentPosition(

function(pos){

const lat=pos.coords.latitude;
const lon=pos.coords.longitude;

const link="https://maps.google.com/?q="+lat+","+lon;

const apellido=localStorage.getItem("apellido")||"Cliente";

enviarWhatsApp(apellido,link);

});

}

function enviarWhatsApp(apellido,origen){

const mensaje="Hola, soy "+apellido+". Enviame un móvil a: "+origen;

const url="https://wa.me/"+telefonoEmpresa+"?text="+encodeURIComponent(mensaje);

window.location.href=url;

}

function abrirFarmacia(){

window.open("https://www.elmiercolesdigital.com.ar/servicios/farmacias-de-turno/","_blank");

}

function abrirEventos(){

window.open("https://www.uruguayenses.com/eventos","_blank");

}

</script>

</body>
</html>
