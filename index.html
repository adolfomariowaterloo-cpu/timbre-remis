<!DOCTYPE html>
<html lang="es">
<head>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Timbre Remis</title>

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#000;
color:white;
text-align:center;
}

header{
padding:20px;
}

header img{
width:160px;
}

header h1{
margin:10px 0;
font-size:28px;
}

.container{
padding:20px;
}

button{
width:90%;
max-width:420px;
margin:12px auto;
padding:20px;
font-size:22px;
border:none;
border-radius:18px;
cursor:pointer;
display:block;
color:white;
font-weight:bold;
box-shadow:0 6px 0 rgba(0,0,0,0.5);
}

button:active{
transform:translateY(4px);
box-shadow:0 2px 0 rgba(0,0,0,0.5);
}

.remis{background:linear-gradient(#ff2b2b,#b30000);}
.emergencia{background:linear-gradient(#ff0000,#7a0000);}
.farmacia{background:linear-gradient(#00c853,#007e33);}
.llamar{background:linear-gradient(#ff8c00,#cc5500);}
.volver{background:#444;}

.casa{background:linear-gradient(#ff2b2b,#b30000);}
.trabajo{background:linear-gradient(#ff8c00,#cc5500);}
.favorito{background:linear-gradient(#9b59b6,#5e3370);}
.ubicacion{background:linear-gradient(#2a9df4,#0b5fa5);}
.config{background:#555;}

input{
width:85%;
padding:10px;
margin:10px 0;
font-size:16px;
border-radius:8px;
border:none;
}

.guardar{
background:#28a745;
}

.small{
font-size:14px;
display:block;
margin-top:5px;
}

.hidden{display:none;}

#confirmacion{
position:fixed;
top:40%;
left:50%;
transform:translate(-50%,-50%);
background:#111;
padding:25px;
border-radius:15px;
font-size:22px;
display:none;
}

#botonPanico{
position:fixed;
bottom:30px;
left:50%;
transform:translateX(-50%);
width:95%;
max-width:450px;
height:100px;
border-radius:20px;
overflow:hidden;
display:flex;
flex-direction:column;
user-select:none;
}

#panicoTexto{
background:#111;
padding:6px;
font-size:16px;
}

#panicoZona{
display:flex;
flex:1;
}

#panicoSilencio{
flex:1;
background:white;
color:black;
display:flex;
align-items:center;
justify-content:center;
}

#panicoSirena{
flex:1;
background:red;
display:flex;
align-items:center;
justify-content:center;
}

</style>
</head>

<body>

<header>
<img src="logo.png">
<h1>Timbre Remis 🔔</h1>
</header>


<div class="container" id="menuPrincipal">

<button class="remis" onclick="abrirMenu('menuRemis')">
Pedir Remis
</button>

<button class="llamar" onclick="llamarEmpresa()">
Llamar a Acción Remis
</button>

<button class="emergencia" onclick="abrirMenu('menuEmergencias')">
Emergencias
</button>

<button class="farmacia" onclick="abrirFarmacia()">
Farmacia de Turno
</button>

</div>



<div class="container hidden" id="menuRemis">

<button class="casa" onclick="pedirDesde('casa')">
Desde Casa
<span class="small" id="dirCasaTexto"></span>
</button>

<button class="trabajo" onclick="pedirDesde('trabajo')">
Desde Trabajo
<span class="small" id="dirTrabajoTexto"></span>
</button>

<button class="favorito" onclick="pedirDesde('favorito')">
Desde Favorito
<span class="small" id="dirFavoritoTexto"></span>
</button>

<button class="ubicacion" onclick="pedirUbicacion()">
Ubicación Actual
</button>

<button class="config" onclick="abrirMenu('configuracion')">
Configuración
</button>

<button class="volver" onclick="volverPrincipal()">
Volver
</button>

</div>



<div class="container hidden" id="menuEmergencias">

<button class="emergencia" onclick="llamar('101')">Policía 101</button>
<button class="emergencia" onclick="llamar('100')">Bomberos 100</button>
<button class="emergencia" onclick="llamar('107')">Ambulancia Hospital</button>
<button class="emergencia" onclick="llamar('3442660877')">Vida Emergencias</button>
<button class="emergencia" onclick="llamar('424242')">Círculo Católico</button>

<button class="volver" onclick="volverPrincipal()">Volver</button>

</div>



<div class="container hidden" id="configuracion">

<input type="text" id="apellido" placeholder="Apellido">

<input type="text" id="dirCasa" placeholder="Dirección Casa">
<input type="text" id="dirTrabajo" placeholder="Dirección Trabajo">
<input type="text" id="dirFavorito" placeholder="Dirección Favorito">

<input type="text" id="contacto1" placeholder="Contacto Emergencia 1">
<input type="text" id="contacto2" placeholder="Contacto Emergencia 2">
<input type="text" id="contacto3" placeholder="Contacto Emergencia 3">

<button class="guardar" onclick="guardarConfig()">Guardar</button>

<button class="volver" onclick="abrirMenu('menuRemis')">Volver</button>

</div>



<div id="confirmacion">
Pedido enviado a Acción Remis
</div>



<div id="botonPanico">

<div id="panicoTexto">
BOTÓN DE PÁNICO – apretar 3 segundos
</div>

<div id="panicoZona">
<div id="panicoSilencio">Silencio</div>
<div id="panicoSirena">Alarma</div>
</div>

</div>



<audio id="sirena">
<source src="sirena.mp3" type="audio/mpeg">
</audio>



<script>

const telefonoEmpresa="5493442641200"
const telefonoLlamada="3442421111"

let panicoTimer=null

document.getElementById("panicoSilencio").addEventListener("touchstart",()=>activarHold(false))
document.getElementById("panicoSirena").addEventListener("touchstart",()=>activarHold(true))
document.addEventListener("touchend",cancelarHold)

function activarHold(sonido){

panicoTimer=setTimeout(()=>{

if(sonido){
document.getElementById("sirena").play()
}

enviarPanico()

},3000)

}

function cancelarHold(){
clearTimeout(panicoTimer)
}



function abrirMenu(menu){

document.getElementById("menuPrincipal").classList.add("hidden")
document.getElementById("menuRemis").classList.add("hidden")
document.getElementById("menuEmergencias").classList.add("hidden")
document.getElementById("configuracion").classList.add("hidden")

document.getElementById("botonPanico").style.display="none"

document.getElementById(menu).classList.remove("hidden")

}



function volverPrincipal(){

document.getElementById("menuPrincipal").classList.remove("hidden")
document.getElementById("menuRemis").classList.add("hidden")
document.getElementById("menuEmergencias").classList.add("hidden")
document.getElementById("configuracion").classList.add("hidden")

document.getElementById("botonPanico").style.display="flex"

}



function llamar(numero){
window.location.href="tel:"+numero
}



function llamarEmpresa(){
window.location.href="tel:"+telefonoLlamada
}



function abrirFarmacia(){
window.open("https://www.elmiercolesdigital.com.ar/servicios/farmacias-de-turno/","_blank")
}



function mostrarConfirmacion(){

const c=document.getElementById("confirmacion")

c.style.display="block"

setTimeout(()=>{

c.style.display="none"

},2000)

}



window.onload=function(){

document.getElementById("apellido").value=localStorage.getItem("apellido")||""
document.getElementById("dirCasa").value=localStorage.getItem("dirCasa")||""
document.getElementById("dirTrabajo").value=localStorage.getItem("dirTrabajo")||""
document.getElementById("dirFavorito").value=localStorage.getItem("dirFavorito")||""

actualizarTextos()

}



function actualizarTextos(){

document.getElementById("dirCasaTexto").innerText=localStorage.getItem("dirCasa")||""
document.getElementById("dirTrabajoTexto").innerText=localStorage.getItem("dirTrabajo")||""
document.getElementById("dirFavoritoTexto").innerText=localStorage.getItem("dirFavorito")||""

}



function guardarConfig(){

localStorage.setItem("apellido",document.getElementById("apellido").value)
localStorage.setItem("dirCasa",document.getElementById("dirCasa").value)
localStorage.setItem("dirTrabajo",document.getElementById("dirTrabajo").value)
localStorage.setItem("dirFavorito",document.getElementById("dirFavorito").value)

actualizarTextos()

abrirMenu("menuRemis")

}



function pedirDesde(tipo){

const apellido=localStorage.getItem("apellido")

if(!apellido){
abrirMenu("configuracion")
return
}

let direccion=localStorage.getItem("dir"+tipo.charAt(0).toUpperCase()+tipo.slice(1))

if(!direccion){
abrirMenu("configuracion")
return
}

mostrarConfirmacion()

enviarWhatsApp(apellido,direccion)

}



function pedirUbicacion(){

const apellido=localStorage.getItem("apellido")

if(!apellido){
abrirMenu("configuracion")
return
}

navigator.geolocation.getCurrentPosition(function(pos){

const lat=pos.coords.latitude
const lon=pos.coords.longitude

const link="https://maps.google.com/?q="+lat+","+lon

mostrarConfirmacion()

enviarWhatsApp(apellido,link)

})

}



function enviarWhatsApp(apellido,origen){

const mensaje="Hola, soy "+apellido+". Enviame un móvil a --> "+origen

const url="whatsapp://send?phone="+telefonoEmpresa+"&text="+encodeURIComponent(mensaje)

window.location.href=url

}



function enviarPanico(){

navigator.geolocation.getCurrentPosition(function(pos){

const lat=pos.coords.latitude
const lon=pos.coords.longitude

const mapa="https://maps.google.com/?q="+lat+","+lon

const mensaje="AUXILIO. Mi ubicación "+mapa

let contactos=[
localStorage.getItem("contacto1"),
localStorage.getItem("contacto2"),
localStorage.getItem("contacto3")
]

contactos.forEach(c=>{

if(c){

window.open("whatsapp://send?phone="+c+"&text="+encodeURIComponent(mensaje))
window.open("sms:"+c+"?body="+encodeURIComponent(mensaje))

}

})

})

}

</script>

</body>
</html>
