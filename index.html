<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timbre Remis</title>

<link rel="manifest" href="manifest.json">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f1ec;
    text-align: center;
}

.container {
    padding: 20px;
}

.logo {
    width: 120px;
    margin-top: 20px;
}

h1 {
    color: #a80000;
    margin-bottom: 5px;
}

.subtitle {
    color: #555;
    margin-bottom: 25px;
}

.btn {
    display: block;
    width: 85%;
    max-width: 350px;
    margin: 12px auto;
    padding: 18px;
    font-size: 18px;
    border-radius: 15px;
    border: none;
    cursor: pointer;
}

.casa { background: #c8e6c9; }
.trabajo { background: #bbdefb; }
.favorito { background: #ffe0b2; }
.otro { background: #e0e0e0; }
.accion { background: #d32f2f; color: white; }

.small-buttons {
    margin-top: 25px;
}

.small-btn {
    display: inline-block;
    margin: 5px;
    padding: 10px 14px;
    border-radius: 50px;
    border: none;
    font-size: 14px;
    background: #dcdcdc;
    cursor: pointer;
}

.message {
    margin-top: 15px;
    color: #a80000;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<img src="logo.png" class="logo">
<h1>Timbre Remis</h1>
<div class="subtitle">Tu remis de confianza</div>

<button class="btn casa" onclick="pedir('casa')">🏡 Casa</button>
<button class="btn trabajo" onclick="pedir('trabajo')">🛠️ Trabajo</button>
<button class="btn favorito" onclick="pedir('favorito')">⭐ Favorito</button>
<button class="btn otro accion" onclick="pedirOtro()">🗺️ Otro lugar</button>

<div class="small-buttons">
<button class="small-btn" onclick="configurar()">⚙️ Configuración</button>
<button class="small-btn" onclick="borrarDatos()">🗑️ Borrar</button>
<button class="small-btn" onclick="tarifa()">💰 Tarifa</button>
</div>

<div class="message" id="mensaje"></div>

</div>

<script>
const telefono = "5493442641200";

function pedir(tipo) {
    const direccion = localStorage.getItem(tipo);
    if (!direccion) {
        alert("Primero configurá la dirección.");
        return;
    }
    enviarWhatsApp(direccion);
}

function pedirOtro() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(pos => {
            const link = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
            enviarWhatsApp("Mi ubicación: " + link);
        });
    }
}

function enviarWhatsApp(texto) {
    document.getElementById("mensaje").innerText = "Enviando pedido...";
    const url = `https://wa.me/${telefono}?text=${encodeURIComponent(texto)}`;
    setTimeout(() => {
        window.location.href = url;
    }, 700);
}

function configurar() {
    const casa = prompt("Dirección de CASA:");
    const trabajo = prompt("Dirección de TRABAJO:");
    const favorito = prompt("Dirección FAVORITA (opcional):");

    if (casa) localStorage.setItem("casa", casa);
    if (trabajo) localStorage.setItem("trabajo", trabajo);
    if (favorito) localStorage.setItem("favorito", favorito);

    alert("Direcciones guardadas.");
}

function borrarDatos() {
    localStorage.clear();
    alert("Datos borrados.");
}

function tarifa() {
    const origen = prompt("¿Desde dónde salís?");
    const destino = prompt("¿A dónde vas?");
    if (origen && destino) {
        enviarWhatsApp(`Hola, estoy en ${origen} y quiero ir a ${destino}. ¿Me dicen tarifa aproximada?`);
    }
}
</script>

</body>
</html>
