<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timbre Remis</title>

<style>
body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background:black;
    color:white;
    text-align:center;
}

.container{
    padding:20px;
    max-width:420px;
    margin:auto;
}

h1{
    margin-bottom:30px;
}

/* BOTONES 3D */
button{
    border:none;
    border-radius:50px;
    padding:18px;
    margin:12px 0;
    font-size:18px;
    color:white;
    cursor:pointer;
    transition:0.15s;
    box-shadow:
        0 6px 0 rgba(0,0,0,0.6),
        0 12px 20px rgba(0,0,0,0.7);
}

button:active{
    transform:translateY(4px);
    box-shadow:
        0 2px 0 rgba(0,0,0,0.6),
        0 6px 10px rgba(0,0,0,0.7);
}

/* COLORES SEGÚN USO */

.btn-casa{
    width:100%;
    background:linear-gradient(to bottom,#ff4d4d,#b30000);
}

.btn-trabajo{
    width:92%;
    background:linear-gradient(to bottom,#8b0000,#4b0000);
}

.btn-favorito{
    width:85%;
    background:linear-gradient(to bottom,#ff8c00,#b35a00);
}

.btn-mapa{
    width:85%;
    background:linear-gradient(to bottom,#42a5f5,#0d47a1);
}

.btn-secundario{
    width:90%;
    background:linear-gradient(to bottom,#444,#222);
}

input{
    width:90%;
    padding:14px;
    border-radius:25px;
    border:none;
    margin:8px 0;
    font-size:16px;
}

.section{
    display:none;
}

.mensaje{
    margin-top:10px;
    font-size:14px;
    color:#ff5252;
}
</style>
</head>

<body>

<div class="container">

<h1>Timbre Remis</h1>

<div id="menu">

<button class="btn-casa" onclick="pedirViaje('Casa')">Desde Casa</button>
<button class="btn-trabajo" onclick="pedirViaje('Trabajo')">Desde Trabajo</button>
<button class="btn-favorito" onclick="pedirViaje('Favorito')">Desde Favorito</button>
<button class="btn-mapa" onclick="mostrarSeccion('viajeManual')">Desde Ubicación Actual</button>

<button class="btn-secundario" onclick="mostrarSeccion('tarifa')">Consultar tarifa</button>

</div>


<!-- PEDIDO MANUAL -->
<div id="viajeManual" class="section">
<h2>Pedido de viaje</h2>

<p>Desde:</p>
<input id="origenManual" placeholder="Escribir dirección">

<p>Hasta:</p>
<input id="destinoManual" placeholder="Escribir destino">

<button class="btn-casa" onclick="enviarViajeManual()">Enviar a WhatsApp</button>
<button class="btn-secundario" onclick="volver()">Volver</button>

<p id="mensajeViaje" class="mensaje"></p>
</div>


<!-- CONSULTA TARIFA -->
<div id="tarifa" class="section">
<h2>Consulta de tarifa</h2>

<p>Desde:</p>
<input id="tarifaDesde" placeholder="Dirección de salida">

<p>Hasta:</p>
<input id="tarifaHasta" placeholder="Dirección de destino">

<button class="btn-favorito" onclick="enviarTarifa()">Consultar por WhatsApp</button>
<button class="btn-secundario" onclick="volver()">Volver</button>

<p id="mensajeTarifa" class="mensaje"></p>
</div>

</div>


<script>

// PONÉ TU NÚMERO REAL ACÁ
const numero = "5493442XXXXXX"; 

const direcciones = {
    Casa: "Tu dirección de casa",
    Trabajo: "Tu dirección de trabajo",
    Favorito: "Tu dirección favorita"
};

function mostrarSeccion(id){
    document.getElementById("menu").style.display="none";
    document.getElementById(id).style.display="block";
}

function volver(){
    document.getElementById("menu").style.display="block";
    document.getElementById("viajeManual").style.display="none";
    document.getElementById("tarifa").style.display="none";
}

function pedirViaje(tipo){
    let destino = prompt("¿A dónde vas?");
    if(!destino) return;

    let origen = direcciones[tipo];

    let texto = "Hola, quiero un móvil desde " + origen + " hasta " + destino;
    let url = "https://wa.me/" + numero + "?text=" + encodeURIComponent(texto);

    location.href = url;
}

function enviarViajeManual(){
    let origen = document.getElementById("origenManual").value;
    let destino = document.getElementById("destinoManual").value;

    if(origen=="" || destino==""){
        document.getElementById("mensajeViaje").innerText="Completá origen y destino";
        return;
    }

    let texto = "Hola, quiero un móvil desde " + origen + " hasta " + destino;
    let url = "https://wa.me/" + numero + "?text=" + encodeURIComponent(texto);

    location.href = url;
}

function enviarTarifa(){
    let desde = document.getElementById("tarifaDesde").value;
    let hasta = document.getElementById("tarifaHasta").value;

    if(desde=="" || hasta==""){
        document.getElementById("mensajeTarifa").innerText="Completá origen y destino";
        return;
    }

    let texto = "Hola, quiero consultar tarifa desde " + desde + " hasta " + hasta;
    let url = "https://wa.me/" + numero + "?text=" + encodeURIComponent(texto);

    location.href = url;
}

</script>

</body>
</html>
