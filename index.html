<!DOCTYPE html>
<html lang="es">
<head>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Timbre Remis</title>

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#000;
color:white;
text-align:center;
}

header{
padding:20px;
}

header img{
width:160px;
}

header h1{
margin:10px 0;
font-size:28px;
}

.container{
padding:20px;
}

button{
width:90%;
max-width:420px;
margin:12px auto;
padding:18px;
font-size:20px;
border:none;
border-radius:18px;
cursor:pointer;
display:block;
color:white;
font-weight:bold;
box-shadow:0 6px 0 rgba(0,0,0,0.5);
}

button:active{
transform:translateY(4px);
box-shadow:0 2px 0 rgba(0,0,0,0.5);
}

.casa{background:linear-gradient(#ff2b2b,#b30000);}
.trabajo{background:linear-gradient(#ff8c00,#cc5500);}
.favorito{background:linear-gradient(#9b59b6,#5e3370);}
.ubicacion{background:linear-gradient(#2a9df4,#0b5fa5);}
.config{background:#555;}

.remis{background:linear-gradient(#ff2b2b,#b30000);}
.flete{background:linear-gradient(#ff6600,#993300);}
.emergencia{background:linear-gradient(#ff0000,#7a0000);}
.util{background:linear-gradient(#0066cc,#003366);}
.eventos{background:linear-gradient(#e1306c,#833ab4);}
.farmacia{background:linear-gradient(#00c853,#007e33);}
.servicios{background:linear-gradient(#00aaff,#006699);}
.instalar{background:linear-gradient(#00c853,#007e33);}
.volver{background:#444;}

input{
width:85%;
padding:10px;
margin:10px 0;
font-size:16px;
border-radius:8px;
border:none;
}

.guardar{
background:#28a745;
}

.small{
font-size:14px;
display:block;
margin-top:5px;
}

.hidden{display:none;}

#botonPanico{
position:fixed;
bottom:25px;
right:20px;
width:80px;
height:80px;
background:red;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 6px 0 rgba(0,0,0,0.5);
}

#textoSOS{
position:fixed;
bottom:110px;
right:28px;
font-weight:bold;
font-size:18px;
background:red;
color:white;
padding:4px 10px;
border-radius:6px;
}

</style>
</head>

<body>

<header>
<img src="logo.png">
<h1>Timbre Remis 🔔</h1>
</header>

<div class="container" id="menuPrincipal">

<button class="remis" onclick="abrirMenu('menuRemis')">Remis</button>

<button class="servicios" onclick="abrirMenu('menuServicios')">
Servicios Domiciliarios
</button>

<button class="emergencia" onclick="abrirMenu('menuEmergencias')">
Teléfonos de Emergencia
</button>

<button class="util" onclick="abrirMenu('menuUtiles')">
Teléfonos Útiles
</button>

<button class="farmacia" onclick="abrirFarmacia()">
Farmacias de Turno
</button>

<button class="eventos"
onclick="window.open('https://www.instagram.com/eventos.cdelu/','_blank')">
Eventos
</button>

<button id="instalarApp" class="instalar hidden">
Instalar App
</button>

</div>

<div class="container hidden" id="menuRemis">

<button class="casa" onclick="pedirDesde('casa')">
Desde Casa
<span class="small" id="dirCasaTexto"></span>
</button>

<button class="trabajo" onclick="pedirDesde('trabajo')">
Desde Trabajo
<span class="small" id="dirTrabajoTexto"></span>
</button>

<button class="favorito" onclick="pedirDesde('favorito')">
Desde Favorito
<span class="small" id="dirFavoritoTexto"></span>
</button>

<button class="ubicacion" onclick="pedirUbicacion()">Ubicación Actual</button>

<button class="config" onclick="abrirMenu('configuracion')">Configuración</button>

<button class="volver" onclick="volverPrincipal()">Volver</button>

</div>

<div class="container hidden" id="menuServicios">

<button class="flete" onclick="pedirFlete()">Fletes</button>

<button class="volver" onclick="volverPrincipal()">Volver</button>

</div>

<div class="container hidden" id="configuracion">

<input type="text" id="apellido" placeholder="Apellido">

<input type="text" id="dirCasa" placeholder="Dirección Casa">
<input type="text" id="dirTrabajo" placeholder="Dirección Trabajo">
<input type="text" id="dirFavorito" placeholder="Dirección Favorito">

<input type="text" id="contacto1" placeholder="Contacto Emergencia 1">
<input type="text" id="contacto2" placeholder="Contacto Emergencia 2">
<input type="text" id="contacto3" placeholder="Contacto Emergencia 3">

<button class="guardar" onclick="guardarConfig()">Guardar</button>

<button class="volver" onclick="abrirMenu('menuRemis')">Volver</button>

</div>

<div id="textoSOS">SOS</div>
<div id="botonPanico"></div>

<script>

const telefonoEmpresa="5493442641200"

function pedirFlete(){

const mensaje="Hola, necesito consultar por un FLETE"

window.location.href="https://wa.me/"+telefonoEmpresa+"?text="+encodeURIComponent(mensaje)

}

function pedirDesde(tipo){

const apellido=localStorage.getItem("apellido")

if(!apellido){
abrirMenu("configuracion")
return
}

let direccion=localStorage.getItem("dir"+tipo.charAt(0).toUpperCase()+tipo.slice(1))

if(!direccion){
abrirMenu("configuracion")
return
}

const mensaje="Hola soy "+apellido+". Enviame un móvil a "+direccion

window.location.href="https://wa.me/"+telefonoEmpresa+"?text="+encodeURIComponent(mensaje)

}

function pedirUbicacion(){

const apellido=localStorage.getItem("apellido")

navigator.geolocation.getCurrentPosition(function(pos){

const lat=pos.coords.latitude
const lon=pos.coords.longitude

const link="https://maps.google.com/?q="+lat+","+lon

const mensaje="Hola soy "+apellido+". Enviame un móvil a mi ubicación "+link

window.location.href="https://wa.me/"+telefonoEmpresa+"?text="+encodeURIComponent(mensaje)

})

}

function abrirMenu(menu){

document.querySelectorAll(".container").forEach(c=>c.classList.add("hidden"))

document.getElementById(menu).classList.remove("hidden")

}

function volverPrincipal(){

document.querySelectorAll(".container").forEach(c=>c.classList.add("hidden"))

document.getElementById("menuPrincipal").classList.remove("hidden")

}

function guardarConfig(){

localStorage.setItem("apellido",document.getElementById("apellido").value)
localStorage.setItem("dirCasa",document.getElementById("dirCasa").value)
localStorage.setItem("dirTrabajo",document.getElementById("dirTrabajo").value)
localStorage.setItem("dirFavorito",document.getElementById("dirFavorito").value)

document.getElementById("dirCasaTexto").innerText=document.getElementById("dirCasa").value
document.getElementById("dirTrabajoTexto").innerText=document.getElementById("dirTrabajo").value
document.getElementById("dirFavoritoTexto").innerText=document.getElementById("dirFavorito").value

abrirMenu("menuRemis")

}

function cargarDirecciones(){

if(localStorage.getItem("dirCasa"))
document.getElementById("dirCasaTexto").innerText=localStorage.getItem("dirCasa")

if(localStorage.getItem("dirTrabajo"))
document.getElementById("dirTrabajoTexto").innerText=localStorage.getItem("dirTrabajo")

if(localStorage.getItem("dirFavorito"))
document.getElementById("dirFavoritoTexto").innerText=localStorage.getItem("dirFavorito")

}

let deferredPrompt

window.addEventListener("beforeinstallprompt",(e)=>{

e.preventDefault()

deferredPrompt=e

document.getElementById("instalarApp").classList.remove("hidden")

})

document.getElementById("instalarApp").addEventListener("click",async()=>{

if(deferredPrompt){

deferredPrompt.prompt()

await deferredPrompt.userChoice

deferredPrompt=null

document.getElementById("instalarApp").classList.add("hidden")

}

})

if('serviceWorker' in navigator){

navigator.serviceWorker.register('sw.js')

}

window.onload=cargarDirecciones

</script>

</body>
</html>
