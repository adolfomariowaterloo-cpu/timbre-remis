<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <title>Timbre Remis</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #000;
            color: white;
            text-align: center;
        }

        header {
            padding: 20px;
        }

        header img {
            width: 160px;
            border-radius: 10px;
        }

        header h1 {
            margin: 10px 0;
            font-size: 28px;
        }

        .container {
            padding: 20px;
        }

        /* Estilo de botones basado en tu original */
        button {
            width: 95%;
            max-width: 420px;
            margin: 12px auto;
            padding: 20px;
            font-size: 20px;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            display: block;
            color: white;
            font-weight: bold;
            box-shadow: 0 6px 0 rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }

        button:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.5);
        }

        /* Colores Originales */
        .casa { background: linear-gradient(#ff2b2b, #b30000); }
        .trabajo { background: linear-gradient(#ff8c00, #cc5500); }
        .favorito { background: linear-gradient(#9b59b6, #5e3370); }
        .ubicacion { background: linear-gradient(#2a9df4, #0b5fa5); }
        .config { background: #555; }

        .remis { background: linear-gradient(#ff2b2b, #b30000); }
        .emergencia { background: linear-gradient(#ff0000, #7a0000); }
        .util { background: linear-gradient(#0066cc, #003366); }
        .eventos { background: linear-gradient(#e1306c, #833ab4); }
        .farmacia { background: linear-gradient(#00c853, #007e33); }
        .servicios { background: linear-gradient(#00aaff, #006699); }
        .volver { background: #444; margin-top: 20px; }
        .guardar { background: #28a745; margin-top: 15px; }

        input {
            width: 90%;
            padding: 15px;
            margin: 10px 0;
            font-size: 16px;
            border-radius: 10px;
            border: none;
            background: #222;
            color: white;
        }

        .small {
            font-size: 14px;
            display: block;
            margin-top: 5px;
            font-weight: normal;
        }

        .hidden { display: none; }

        /* Botón de Pánico con efecto FLASH */
        #panic-wrapper {
            position: fixed;
            bottom: 25px;
            right: 20px;
            z-index: 9999;
        }

        #textoSOS {
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 18px;
            background: red;
            color: white;
            padding: 4px 12px;
            border-radius: 10px;
            display: inline-block;
        }

        #botonPanico {
            width: 85px;
            height: 85px;
            background: red;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 0 rgba(0,0,0,0.5);
            border: 4px solid white;
            margin: 0 auto;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }

        /* EL FLASH DE SEGURIDAD GIGANTE */
        #botonPanico.activo {
            background: #00ff00;
            box-shadow: 0 0 0 200vw rgba(0, 255, 0, 0.6); 
            animation: pulseFlash 0.4s infinite;
        }

        @keyframes pulseFlash {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        #instalarBanner {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #111;
            padding: 15px;
            z-index: 10000;
            border-top: 2px solid red;
        }
    </style>
</head>

<body>

<div id="instalarBanner">
    <button onclick="instalarApp()" style="background:#28a745; width: 100%;">
        Instalar Acción Remises en tu celular
    </button>
</div>

<header>
    <img src="logo.png" alt="Logo" onerror="this.src='https://via.placeholder.com/160x100?text=ACCION+REMIS'">
    <h1>Timbre Remis 🔔</h1>
</header>

<!-- MENU PRINCIPAL -->
<div class="container" id="menuPrincipal">
    <button class="remis" onclick="abrirMenu('menuRemis')">Remis</button>
    <button class="servicios" onclick="abrirMenu('menuServicios')">Servicios Domiciliarios</button>
    <button class="emergencia" onclick="abrirMenu('menuEmergencias')">Teléfonos de Emergencia</button>
    <button class="util" onclick="abrirMenu('menuUtiles')">Teléfonos Útiles</button>
    <button class="farmacia" onclick="abrirFarmacia()">Farmacias de Turno</button>
    <button class="eventos" onclick="window.open('https://www.instagram.com/eventos.cdelu/','_blank')">Eventos</button>
</div>

<!-- MENU REMIS -->
<div class="container hidden" id="menuRemis">
    <button class="casa" onclick="pedirDesde('casa')">
        Desde Casa
        <span class="small" id="dirCasaTexto"></span>
    </button>
    <button class="trabajo" onclick="pedirDesde('trabajo')">
        Desde Trabajo
        <span class="small" id="dirTrabajoTexto"></span>
    </button>
    <button class="favorito" onclick="pedirDesde('favorito')">
        Desde Favorito
        <span class="small" id="dirFavoritoTexto"></span>
    </button>
    <button class="ubicacion" onclick="pedirUbicacion()">Ubicación Actual</button>
    <button class="config" onclick="abrirMenu('configuracion')">Configuración</button>
    <button class="volver" onclick="volverPrincipal()">Volver</button>
</div>

<!-- MENU SERVICIOS DOMICILIARIOS (TODOS TUS SERVICIOS ORIGINALES) -->
<div class="container hidden" id="menuServicios">
    <button class="util" onclick="llamar('3442666445')">Mecánico</button>
    <button class="util" onclick="llamar('3442424688')">Electricista</button>
    <button class="util" onclick="llamar('3442426688')">Plomero / Gasista</button>
    <button class="util" onclick="llamar('3442406327')">Costurera</button>
    <button class="util" onclick="llamar('3442406327')">Estética Uñas y Cejas</button>
    <button class="util" onclick="llamar('34246327')">Peluquería</button>
    <button class="util" onclick="llamar('3442677247')">Zapatería</button>
    <button class="util" onclick="llamar('3442583937')">Limpieza Casas / Oficinas</button>
    <button class="util" onclick="llamar('3442485255')">Cuidado Señoras / Niños</button>
    <button class="volver" onclick="volverPrincipal()">Volver</button>
</div>

<!-- MENU EMERGENCIAS (TUS ORIGINALES + NUEVOS) -->
<div class="container hidden" id="menuEmergencias">
    <button class="emergencia" onclick="llamar('101')">Policía 101</button>
    <button class="emergencia" onclick="llamar('100')">Bomberos 100</button>
    <button class="emergencia" onclick="llamar('107')">Ambulancia Hospital 107</button>
    <button class="emergencia" onclick="llamar('3442660877')">Vida Emergencias Médicas</button>
    <button class="emergencia" onclick="llamar('424242')">Círculo Católico Emergencia</button>
    <button class="emergencia" onclick="llamar('425294')">ALERTA Emergencias</button>
    <button class="emergencia" onclick="llamar('08007770080')">ENERSA Cable Suelto</button>
    <button class="emergencia" onclick="llamar('0800777427632')">GAS NEA Fuga Gas</button>
    <button class="volver" onclick="volverPrincipal()">Volver</button>
</div>

<!-- MENU UTILES (TUS ORIGINALES + NUEVOS) -->
<div class="container hidden" id="menuUtiles">
    <button class="util" onclick="llamar('443901')">Hospital Urquiza 443901</button>
    <button class="util" onclick="llamar('422352')">Terminal Ómnibus 422352</button>
    <button class="util" onclick="llamar('103')">Guardia Urbana 103</button>
    <button class="util" onclick="llamar('106')">Prefectura 106</button>
    <button class="util" onclick="llamar('427654')">Cooperativa Eléctrica</button>
    <button class="util" onclick="llamar('423333')">Municipalidad</button>
    <button class="volver" onclick="volverPrincipal()">Volver</button>
</div>

<!-- CONFIGURACION -->
<div class="container hidden" id="configuracion">
    <input type="text" id="apellido" placeholder="Tu Apellido">
    <input type="text" id="dirCasa" placeholder="Dirección Casa">
    <input type="text" id="dirTrabajo" placeholder="Dirección Trabajo">
    <input type="text" id="dirFavorito" placeholder="Dirección Favorito">
    <h3 style="margin-bottom:0">Contactos SOS (WhastApp)</h3>
    <input type="number" id="contacto1" placeholder="Ej: 5493442000000">
    <input type="number" id="contacto2" placeholder="Contacto Emergencia 2">
    <input type="number" id="contacto3" placeholder="Contacto Emergencia 3">
    <button class="guardar" onclick="guardarConfig()">Guardar Configuración</button>
    <button class="volver" onclick="abrirMenu('menuRemis')">Volver</button>
</div>

<!-- BOTON PANICO ESTRUCTURA -->
<div id="panic-wrapper">
    <div id="textoSOS">SOS</div>
    <div id="botonPanico">
        <svg style="width:40px;height:40px" viewBox="0 0 24 24">
            <path fill="white" d="M12,2L1,21H23M12,6L19.53,19H4.47M11,10V14H13V10M11,16V18H13V16" />
        </svg>
    </div>
</div>

<audio id="sirena" loop>
    <source src="sirena.mp3" type="audio/mpeg">
</audio>

<script>
const telefonoEmpresa = "5493442641200";
let panicoTimer = null;
let deferredPrompt;

// Al cargar la página
window.onload = function() {
    if(!localStorage.getItem("bienvenida")){
        alert("Bienvenido. Cargue en CONFIGURACIÓN sus datos y contactos de emergencia.");
        localStorage.setItem("bienvenida","ok");
    }

    // Cargar datos guardados
    document.getElementById("apellido").value = localStorage.getItem("apellido") || "";
    document.getElementById("dirCasa").value = localStorage.getItem("dirCasa") || "";
    document.getElementById("dirTrabajo").value = localStorage.getItem("dirTrabajo") || "";
    document.getElementById("dirFavorito").value = localStorage.getItem("dirFavorito") || "";
    document.getElementById("contacto1").value = localStorage.getItem("contacto1") || "";
    document.getElementById("contacto2").value = localStorage.getItem("contacto2") || "";
    document.getElementById("contacto3").value = localStorage.getItem("contacto3") || "";

    actualizarTextos();
}

// Navegación
function abrirMenu(menu) {
    const menus = ["menuPrincipal", "menuRemis", "menuEmergencias", "menuUtiles", "menuServicios", "configuracion"];
    menus.forEach(m => document.getElementById(m).classList.add("hidden"));
    document.getElementById(menu).classList.remove("hidden");
    window.scrollTo(0,0);
}

function volverPrincipal() {
    abrirMenu("menuPrincipal");
}

function llamar(numero) {
    window.location.href = "tel:" + numero;
}

function abrirFarmacia() {
    window.open("https://www.elmiercolesdigital.com.ar/servicios/farmacias-de-turno/","_blank");
}

// Lógica de Remis
function pedirDesde(tipo) {
    const apellido = localStorage.getItem("apellido");
    let direccion = localStorage.getItem("dir" + tipo.charAt(0).toUpperCase() + tipo.slice(1));

    if(!apellido || !direccion) {
        alert("Por favor configure su apellido y dirección primero.");
        abrirMenu("configuracion");
        return;
    }

    enviarWhatsApp(apellido, direccion);
}

function pedirUbicacion() {
    const apellido = localStorage.getItem("apellido");
    if(!apellido) {
        abrirMenu("configuracion");
        return;
    }

    navigator.geolocation.getCurrentPosition(function(pos) {
        const link = "https://maps.google.com/?q=" + pos.coords.latitude + "," + pos.coords.longitude;
        enviarWhatsApp(apellido, link);
    }, function() {
        alert("No se pudo obtener la ubicación. Verifique que el GPS esté encendido.");
    });
}

function enviarWhatsApp(apellido, origen) {
    const mensaje = "Hola, soy " + apellido + ". Enviame un móvil a --> " + origen;
    // Usamos wa.me que es más compatible
    const url = "https://wa.me/" + telefonoEmpresa + "?text=" + encodeURIComponent(mensaje);
    window.open(url, '_blank');
}

// Guardar configuración
function guardarConfig() {
    localStorage.setItem("apellido", document.getElementById("apellido").value);
    localStorage.setItem("dirCasa", document.getElementById("dirCasa").value);
    localStorage.setItem("dirTrabajo", document.getElementById("dirTrabajo").value);
    localStorage.setItem("dirFavorito", document.getElementById("dirFavorito").value);
    localStorage.setItem("contacto1", document.getElementById("contacto1").value);
    localStorage.setItem("contacto2", document.getElementById("contacto2").value);
    localStorage.setItem("contacto3", document.getElementById("contacto3").value);

    actualizarTextos();
    alert("Datos guardados con éxito.");
    abrirMenu("menuRemis");
}

function actualizarTextos() {
    document.getElementById("dirCasaTexto").innerText = localStorage.getItem("dirCasa") || "No configurada";
    document.getElementById("dirTrabajoTexto").innerText = localStorage.getItem("dirTrabajo") || "No configurada";
    document.getElementById("dirFavoritoTexto").innerText = localStorage.getItem("dirFavorito") || "No configurada";
}

// LOGICA BOTON PANICO MEJORADA
const botonP = document.getElementById("botonPanico");

botonP.addEventListener("touchstart", function(e) {
    e.preventDefault();
    panicoTimer = setTimeout(activarPanico, 2000); 
});

botonP.addEventListener("touchend", function() {
    clearTimeout(panicoTimer);
});

botonP.addEventListener("mousedown", function() {
    panicoTimer = setTimeout(activarPanico, 2000);
});

botonP.addEventListener("mouseup", function() {
    clearTimeout(panicoTimer);
});

function activarPanico() {
    // ACTIVAR FLASH VISUAL
    botonP.classList.add("activo");
    document.getElementById("sirena").play().catch(e => console.log("Audio bloqueado"));

    navigator.geolocation.getCurrentPosition(function(pos) {
        const link = "https://maps.google.com/?q=" + pos.coords.latitude + "," + pos.coords.longitude;
        const mensaje = "⚠️ AUXILIO: Estoy en una situación de emergencia. Mi ubicación: " + link;

        const contactos = [
            localStorage.getItem("contacto1"),
            localStorage.getItem("contacto2"),
            localStorage.getItem("contacto3")
        ];

        contactos.forEach(c => {
            if(c && c.trim() !== "") {
                window.open("https://wa.me/" + c + "?text=" + encodeURIComponent(mensaje), "_blank");
            }
        });
    });

    // Desactivar flash después de 8 segundos
    setTimeout(() => {
        botonP.classList.remove("activo");
        document.getElementById("sirena").pause();
    }, 8000);
}

// PWA
window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById("instalarBanner").style.display = "block";
});

function instalarApp() {
    document.getElementById("instalarBanner").style.display = "none";
    deferredPrompt.prompt();
}
</script>

</body>
</html>
