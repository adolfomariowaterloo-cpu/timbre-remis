<!DOCTYPE html>
<html lang="es">
<head>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Timbre Remis</title>

<style>

body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#000;
color:white;
text-align:center;
}

header{padding:20px;}
header img{width:160px;}
header h1{margin:10px 0;font-size:28px;}

.container{padding:20px;}

button{
width:90%;
max-width:420px;
margin:12px auto;
padding:18px;
font-size:20px;
border:none;
border-radius:18px;
cursor:pointer;
display:block;
color:white;
font-weight:bold;
box-shadow:0 6px 0 rgba(0,0,0,0.5);
}

button:active{
transform:translateY(4px);
box-shadow:0 2px 0 rgba(0,0,0,0.5);
}

.remis{background:linear-gradient(#ff2b2b,#b30000);}
.emergencia{background:linear-gradient(#ff0000,#7a0000);}
.util{background:linear-gradient(#0066cc,#003366);}
.eventos{background:linear-gradient(#e1306c,#833ab4);}
.farmacia{background:linear-gradient(#00c853,#007e33);}
.servicios{background:linear-gradient(#ff9800,#c66900);}
.servicioItem{background:linear-gradient(#444,#222);}
.volver{background:#444;}

input{
width:85%;
padding:10px;
margin:8px 0;
font-size:15px;
border-radius:8px;
border:none;
}

.guardar{background:#28a745;}
.hidden{display:none;}

#botonPanico{

position:fixed;
bottom:20px;
right:20px;
width:90px;
height:90px;
border-radius:50%;
background:red;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
font-size:12px;
text-align:center;
box-shadow:0 0 20px red;

}

</style>
</head>

<body>

<header>
<img src="logo.png">
<h1>Timbre Remis 🔔</h1>
</header>

<div class="container" id="menuPrincipal">

<button class="remis" onclick="abrirMenu('menuRemis')">Remis</button>

<button class="emergencia" onclick="abrirMenu('menuEmergencias')">
Teléfonos de Emergencia
</button>

<button class="util" onclick="abrirMenu('menuUtiles')">
Teléfonos Útiles
</button>

<button class="servicios" onclick="abrirMenu('menuServicios')">
Contratación de Servicios
</button>

<button class="farmacia" onclick="abrirFarmacia()">
Farmacias de Turno
</button>

<button class="eventos"
onclick="window.open('https://www.instagram.com/eventos.cdelu/','_blank')">
Eventos
</button>

</div>



<div class="container hidden" id="menuServicios">

<button class="servicioItem" onclick="llamarServicio('mecanico')">Auxilio Mecánico</button>

<button class="servicioItem" onclick="llamarServicio('limpieza')">Serv. Limpieza Casa / Oficina</button>

<button class="servicioItem" onclick="llamarServicio('plomeria')">Plomería</button>

<button class="servicioItem" onclick="llamarServicio('electricidad')">Electricidad Domiciliaria</button>

<button class="servicioItem" onclick="llamarServicio('gasista')">Gasista</button>

<button class="servicioItem" onclick="llamarServicio('albanil')">Albañilería</button>

<button class="servicioItem" onclick="llamarServicio('pintor')">Pintor de Casas</button>

<button class="servicioItem" onclick="llamarServicio('carpintero')">Carpintero</button>

<button class="servicioItem" onclick="llamarServicio('jardin')">Jardinería / Corte de Pasto</button>

<button class="servicioItem" onclick="llamarServicio('costurera')">Costurera Profesional</button>

<button class="servicioItem" onclick="llamarServicio('estetica')">Estética Corporal</button>

<button class="volver" onclick="volverPrincipal()">Volver</button>

</div>



<div class="container hidden" id="configuracion">

<h3>Servicios</h3>

<input id="mecanico_nombre" placeholder="Auxilio Mecánico - Nombre">
<input id="mecanico_tel" placeholder="Auxilio Mecánico - Teléfono">
