<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <title>Timbre Remis - Acción</title>
    
    <!-- Estilos Visuales -->
    <style>
        :root {
            --rojo-accion: #ff2b2b;
            --azul-servicios: #2a9df4;
            --verde-farmacia: #00c853;
            --purpura-eventos: #833ab4;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000;
            color: white;
            text-align: center;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            padding: 30px 20px;
        }

        header img {
            width: 180px;
            filter: drop-shadow(0 4px 8px rgba(255,255,255,0.1));
            border-radius: 10px;
        }

        header h1 {
            margin: 15px 0;
            font-size: 26px;
            font-weight: bold;
        }

        .container {
            padding: 10px 20px;
            max-width: 500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Botones Principales */
        .btn-menu {
            width: 100%;
            padding: 22px;
            font-size: 20px;
            border: none;
            border-radius: 18px;
            cursor: pointer;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.1s, filter 0.2s;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .btn-menu:active {
            transform: scale(0.97);
            filter: brightness(0.8);
        }

        /* Colores Degradados según tu diseño */
        .remis { background: linear-gradient(90deg, #ff5f6d, #ff2b2b); }
        .servicios { background: linear-gradient(90deg, #2193b0, #6dd5ed); }
        .emergencia { background: linear-gradient(90deg, #cb2d3e, #ef473a); }
        .util { background: linear-gradient(90deg, #2c3e50, #4ca1af); }
        .farmacia { background: linear-gradient(90deg, #11998e, #38ef7d); }
        .eventos { background: linear-gradient(90deg, #833ab4, #fd1d1d, #fcb045); }
        .volver { background: #333; margin-top: 20px; }
        .config { background: #444; }
        .guardar { background: #28a745; margin-top: 10px; }

        /* Botón de Pánico Flotante */
        #panic-container {
            position: fixed;
            bottom: 30px;
            right: 25px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #panic-label {
            background: rgba(255, 0, 0, 0.85);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
            pointer-events: none;
        }

        #botonPanico {
            width: 85px;
            height: 85px;
            background: red;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(255,0,0,0.5);
            border: 4px solid white;
            cursor: pointer;
            user-select: none;
        }

        #botonPanico svg {
            width: 45px;
            fill: white;
        }

        #botonPanico.activo {
            background: #00ff00;
            animation: pulse 0.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0,255,0,0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 20px rgba(0,255,0,0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(0,255,0,0); }
        }

        /* Configuración e Inputs */
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 15px;
            margin-bottom: 5px;
            font-size: 16px;
            border-radius: 12px;
            border: 1px solid #444;
            background: #222;
            color: white;
        }

        label {
            display: block;
            text-align: left;
            font-size: 14px;
            color: #aaa;
            margin-bottom: 5px;
            margin-left: 5px;
        }

        .hidden { display: none !important; }

        .small {
            font-size: 12px;
            opacity: 0.8;
            display: block;
            margin-top: 4px;
            font-weight: normal;
        }

        /* Banner de instalación */
        #instalarBanner {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: #1a1a1a;
            padding: 20px;
            border-top: 2px solid var(--rojo-accion);
            z-index: 1000;
            display: none;
        }
    </style>
</head>

<body>

<div id="instalarBanner">
    <p style="margin: 0 0 10px 0;">¿Querés instalar la App en tu inicio?</p>
    <button onclick="instalarApp()" class="btn-menu" style="background: #28a745; font-size: 16px; padding: 10px;">
        INSTALAR AHORA
    </button>
</div>

<header>
    <img src="logo.png" alt="Acción Remises" onerror="this.src='https://via.placeholder.com/160x100?text=ACCION+REMIS'">
    <h1>Timbre Remis 🔔</h1>
</header>

<!-- MENÚ PRINCIPAL -->
<div class="container" id="menuPrincipal">
    <button class="btn-menu remis" onclick="abrirMenu('menuRemis')">Pedir un Remis</button>
    <button class="btn-menu servicios" onclick="abrirMenu('menuServicios')">Servicios Domicilio</button>
    <button class="btn-menu emergencia" onclick="abrirMenu('menuEmergencias')">Emergencias</button>
    <button class="btn-menu util" onclick="abrirMenu('menuUtiles')">Teléfonos Útiles</button>
    <button class="btn-menu farmacia" onclick="abrirFarmacia()">Farmacias de Turno</button>
    <button class="btn-menu eventos" onclick="window.open('https://www.instagram.com/eventos.cdelu/','_blank')">Eventos Locales</button>
</div>

<!-- MENÚ REMIS -->
<div class="container hidden" id="menuRemis">
    <button class="btn-menu remis" onclick="pedirDesde('Casa')">
        Desde Casa
        <span class="small" id="label-Casa">Configurar en ajustes</span>
    </button>
    <button class="btn-menu util" onclick="pedirDesde('Trabajo')">
        Desde Trabajo
        <span class="small" id="label-Trabajo">Configurar en ajustes</span>
    </button>
    <button class="btn-menu servicios" onclick="pedirDesde('Favorito')">
        Desde Favorito
        <span class="small" id="label-Favorito">Configurar en ajustes</span>
    </button>
    <button class="btn-menu farmacia" onclick="pedirUbicacion()">Mi Ubicación Actual</button>
    <button class="btn-menu config" onclick="abrirMenu('configuracion')">⚙️ Configuración</button>
    <button class="btn-menu volver" onclick="volverPrincipal()">Volver</button>
</div>

<!-- MENÚ SERVICIOS -->
<div class="container hidden" id="menuServicios">
    <button class="btn-menu util" onclick="llamar('3442666445')">Mecánico</button>
    <button class="btn-menu util" onclick="llamar('3442424688')">Electricista</button>
    <button class="btn-menu util" onclick="llamar('3442426688')">Plomero</button>
    <button class="btn-menu util" onclick="llamar('3442583937')">Limpieza</button>
    <button class="btn-menu volver" onclick="volverPrincipal()">Volver</button>
</div>

<!-- MENÚ EMERGENCIAS -->
<div class="container hidden" id="menuEmergencias">
    <button class="btn-menu emergencia" onclick="llamar('101')">Policía 101</button>
    <button class="btn-menu emergencia" onclick="llamar('100')">Bomberos 100</button>
    <button class="btn-menu emergencia" onclick="llamar('107')">Ambulancia 107</button>
    <button class="btn-menu volver" onclick="volverPrincipal()">Volver</button>
</div>

<!-- MENÚ ÚTILES -->
<div class="container hidden" id="menuUtiles">
    <button class="btn-menu util" onclick="llamar('443901')">Hospital</button>
    <button class="btn-menu util" onclick="llamar('422352')">Terminal</button>
    <button class="btn-menu volver" onclick="volverPrincipal()">Volver</button>
</div>

<!-- CONFIGURACIÓN -->
<div class="container hidden" id="configuracion">
    <h2 style="margin-top:0">Configuración</h2>
    <label>Tu Apellido:</label>
    <input type="text" id="cfg-apellido" placeholder="Ej: Perez">
    
    <label>Dirección Casa:</label>
    <input type="text" id="cfg-dirCasa" placeholder="Calle y Nro">
    
    <label>Dirección Trabajo:</label>
    <input type="text" id="cfg-dirTrabajo" placeholder="Calle y Nro">
    
    <label>Dirección Favorita:</label>
    <input type="text" id="cfg-dirFavorito" placeholder="Ej: Casa de Mamá">

    <label>WhatsApp Auxilio (con 549...):</label>
    <input type="number" id="cfg-contacto1" placeholder="Ej: 5493442000000">

    <button class="btn-menu guardar" onclick="guardarConfig()">GUARDAR DATOS</button>
    <button class="btn-menu volver" onclick="abrirMenu('menuRemis')">CANCELAR</button>
</div>

<!-- BOTÓN DE PÁNICO -->
<div id="panic-container">
    <div id="panic-label">MANTENER PARA SOS</div>
    <div id="botonPanico">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
    </div>
</div>

<audio id="sirena" loop>
    <source src="sirena.mp3" type="audio/mpeg">
</audio>

<script>
const telefonoEmpresa = "5493442641200";
let panicoTimer = null;
let deferredPrompt;

// --- INICIALIZACIÓN ---
window.onload = function() {
    cargarDatos();
    // Mensaje de bienvenida corregido (sin alert de navegador si es posible)
    if(!localStorage.getItem("bienvenida")) {
        console.log("Primera vez en la app");
        localStorage.setItem("bienvenida", "ok");
    }
}

// --- NAVEGACIÓN ---
function abrirMenu(id) {
    const menus = ['menuPrincipal', 'menuRemis', 'menuServicios', 'menuEmergencias', 'menuUtiles', 'configuracion'];
    menus.forEach(m => document.getElementById(m).classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
    window.scrollTo(0,0);
}

function volverPrincipal() {
    abrirMenu('menuPrincipal');
}

// --- LÓGICA DE DATOS ---
function guardarConfig() {
    localStorage.setItem("apellido", document.getElementById("cfg-apellido").value);
    localStorage.setItem("dirCasa", document.getElementById("cfg-dirCasa").value);
    localStorage.setItem("dirTrabajo", document.getElementById("cfg-dirTrabajo").value);
    localStorage.setItem("dirFavorito", document.getElementById("cfg-dirFavorito").value);
    localStorage.setItem("contacto1", document.getElementById("cfg-contacto1").value);
    
    cargarDatos();
    abrirMenu('menuRemis');
}

function cargarDatos() {
    document.getElementById("cfg-apellido").value = localStorage.getItem("apellido") || "";
    document.getElementById("cfg-dirCasa").value = localStorage.getItem("dirCasa") || "";
    document.getElementById("cfg-dirTrabajo").value = localStorage.getItem("dirTrabajo") || "";
    document.getElementById("cfg-dirFavorito").value = localStorage.getItem("dirFavorito") || "";
    document.getElementById("cfg-contacto1").value = localStorage.getItem("contacto1") || "";

    document.getElementById("label-Casa").innerText = localStorage.getItem("dirCasa") || "Sin configurar";
    document.getElementById("label-Trabajo").innerText = localStorage.getItem("dirTrabajo") || "Sin configurar";
    document.getElementById("label-Favorito").innerText = localStorage.getItem("dirFavorito") || "Sin configurar";
}

// --- FUNCIONES DE SERVICIO ---
function llamar(num) {
    window.location.href = "tel:" + num;
}

function abrirFarmacia() {
    window.open("https://www.elmiercolesdigital.com.ar/servicios/farmacias-de-turno/", "_blank");
}

function pedirDesde(tipo) {
    const apellido = localStorage.getItem("apellido");
    const direccion = localStorage.getItem("dir" + tipo);
    
    if(!apellido || !direccion) {
        alert("Por favor, completa tu Apellido y Dirección en Configuración.");
        abrirMenu("configuracion");
        return;
    }
    
    const msg = `Hola, soy ${apellido}. Por favor, enviame un móvil a: ${direccion}`;
    const url = `https://wa.me/${telefonoEmpresa}?text=${encodeURIComponent(msg)}`;
    window.open(url, '_blank');
}

function pedirUbicacion() {
    const apellido = localStorage.getItem("apellido");
    if(!apellido) {
        alert("Por favor, ingresa tu apellido en Configuración.");
        abrirMenu("configuracion");
        return;
    }

    navigator.geolocation.getCurrentPosition(function(pos) {
        const link = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
        const msg = `Hola, soy ${apellido}. Enviame un móvil a mi ubicación actual: ${link}`;
        window.open(`https://wa.me/${telefonoEmpresa}?text=${encodeURIComponent(msg)}`, '_blank');
    }, function() {
        alert("No se pudo obtener tu ubicación. Activá el GPS.");
    });
}

// --- BOTÓN DE PÁNICO ---
const btnPanico = document.getElementById("botonPanico");

btnPanico.addEventListener("mousedown", iniciarConteo);
btnPanico.addEventListener("touchstart", iniciarConteo);
btnPanico.addEventListener("mouseup", detenerConteo);
btnPanico.addEventListener("touchend", detenerConteo);

function iniciarConteo(e) {
    e.preventDefault();
    panicoTimer = setTimeout(activarEmergencia, 2000); // 2 segundos manteniendo
}

function detenerConteo() {
    clearTimeout(panicoTimer);
}

function activarEmergencia() {
    btnPanico.classList.add("activo");
    const sirena = document.getElementById("sirena");
    sirena.play().catch(e => console.log("Audio requiere interacción previa"));
    
    navigator.geolocation.getCurrentPosition(function(pos) {
        const link = `https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
        const contacto = localStorage.getItem("contacto1");
        const msg = `⚠️ ¡EMERGENCIA! Necesito ayuda urgente. Mi ubicación actual es: ${link}`;
        
        if(contacto) {
            window.open(`https://wa.me/${contacto}?text=${encodeURIComponent(msg)}`, '_blank');
        } else {
            alert("No tenés contacto de emergencia configurado. Se activó la sirena.");
        }
    });

    setTimeout(() => {
        btnPanico.classList.remove("activo");
        sirena.pause();
    }, 10000); // Se apaga a los 10 segundos
}

// --- INSTALACIÓN PWA ---
window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById("instalarBanner").style.display = "block";
});

function instalarApp() {
    document.getElementById("instalarBanner").style.display = "none";
    deferredPrompt.prompt();
}
</script>

</body>
</html>
