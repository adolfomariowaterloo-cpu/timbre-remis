<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remis Timbre</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:black;
  color:white;
  text-align:center;
}

h1{
  margin-top:20px;
}

.container{
  padding:20px;
}

button{
  width:90%;
  padding:18px;
  margin:10px auto;
  border:none;
  border-radius:15px;
  font-size:18px;
  color:white;
  cursor:pointer;
  box-shadow:0 5px 10px rgba(0,0,0,0.6);
}

.casa{
  background:linear-gradient(to bottom,#ff4d4d,#b30000);
}

.trabajo{
  background:linear-gradient(to bottom,#990000,#660000);
}

.favorito{
  background:linear-gradient(to bottom,#ff944d,#cc5200);
}

.mapa{
  background:linear-gradient(to bottom,#3399ff,#0066cc);
}

.config{
  background:linear-gradient(to bottom,#666,#333);
}

input{
  width:90%;
  padding:12px;
  margin:8px;
  border-radius:10px;
  border:none;
  font-size:16px;
}

</style>
</head>

<body>

<h1>🚕 Remis Timbre</h1>

<div class="container">

<button class="casa" onclick="enviarDesde('casa')">🏠 Desde Casa</button>
<button class="trabajo" onclick="enviarDesde('trabajo')">💼 Desde Trabajo</button>
<button class="favorito" onclick="enviarDesde('favorito')">⭐ Desde Favorito</button>
<button class="mapa" onclick="usarGPS()">📍 Enviar mi ubicación</button>

<button class="config" onclick="mostrarConfig()">⚙ CONFIGURACIÓN</button>

<div id="configuracion" style="display:none;">
  <input id="nombre" placeholder="Nombre y Apellido">
  <input id="casaDir" placeholder="Dirección de Casa">
  <input id="trabajoDir" placeholder="Dirección de Trabajo">
  <input id="favoritoDir" placeholder="Dirección Favorita">
  <button onclick="guardarConfig()">Guardar</button>
</div>

</div>

<script>

let telefonoEmpresa = "5493442641200";

function mostrarConfig(){
  document.getElementById("configuracion").style.display="block";
}

function guardarConfig(){
  localStorage.setItem("nombre", document.getElementById("nombre").value);
  localStorage.setItem("casa", document.getElementById("casaDir").value);
  localStorage.setItem("trabajo", document.getElementById("trabajoDir").value);
  localStorage.setItem("favorito", document.getElementById("favoritoDir").value);
  alert("Datos guardados");
  document.getElementById("configuracion").style.display="none";
}

function enviarDesde(tipo){
  let nombre = localStorage.getItem("nombre");
  if(!nombre){
    alert("Primero complete configuración");
    return;
  }

  let direccion = localStorage.getItem(tipo);
  if(!direccion){
    alert("No hay dirección cargada en configuración");
    return;
  }

  let mensaje = "Hola, soy " + nombre + 
                ". Solicito un móvil desde: " + direccion;

  window.open("https://wa.me/"+telefonoEmpresa+"?text="+encodeURIComponent(mensaje));
}

function usarGPS(){
  let nombre = localStorage.getItem("nombre");
  if(!nombre){
    alert("Primero complete configuración");
    return;
  }

  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(function(pos){
      let lat = pos.coords.latitude;
      let lon = pos.coords.longitude;

      let link = "https://www.google.com/maps?q="+lat+","+lon;

      let mensaje = "Hola, soy " + nombre +
                    ". Solicito un móvil desde mi ubicación actual: " + link;

      window.open("https://wa.me/"+telefonoEmpresa+"?text="+encodeURIComponent(mensaje));
    });
  }else{
    alert("GPS no disponible");
  }
}

window.onload = function(){
  if(localStorage.getItem("nombre")){
    document.getElementById("nombre").value = localStorage.getItem("nombre");
    document.getElementById("casaDir").value = localStorage.getItem("casa");
    document.getElementById("trabajoDir").value = localStorage.getItem("trabajo");
    document.getElementById("favoritoDir").value = localStorage.getItem("favorito");
  }
}

</script>

</body>
</html>
