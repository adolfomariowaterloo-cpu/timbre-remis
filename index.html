<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Timbre Remis - Versión Final</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --remis-red: #e63946;
            --remis-dark: #0a0a0a;
            --remis-gold: #ffb703;
            --glass: rgba(255, 255, 255, 0.04);
        }

        /* Animaciones para el botón principal */
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(230, 57, 70, 0.7); transform: scale(1); }
            70% { box-shadow: 0 0 0 15px rgba(230, 57, 70, 0); transform: scale(1.02); }
            100% { box-shadow: 0 0 0 0 rgba(230, 57, 70, 0); transform: scale(1); }
        }

        @keyframes shine {
            from { left: -100%; }
            to { left: 100%; }
        }

        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', -apple-system, sans-serif;
            scrollbar-width: none;
        }

        ::-webkit-scrollbar { display: none; }

        body { 
            background: var(--remis-dark); 
            color: #eee; 
            margin: 0; 
            overflow: hidden; 
            height: 100vh;
        }

        .app-container {
            max-width: 500px;
            margin: 0 auto;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            background: linear-gradient(180deg, #121212 0%, #000000 100%);
        }

        /* Header con Logo del Autito */
        .brand-header {
            padding: 40px 20px 20px;
            text-align: center;
            background: linear-gradient(to bottom, rgba(230, 57, 70, 0.1), transparent);
        }

        .logo-svg {
            width: 100px;
            height: auto;
            margin: 0 auto 10px;
            filter: drop-shadow(0 0 8px rgba(230, 57, 70, 0.6));
        }

        /* Botón de Pedido */
        .main-cta-btn {
            background: linear-gradient(135deg, #ff4d4d 0%, #b30000 100%);
            border-radius: 28px;
            padding: 24px;
            position: relative;
            overflow: hidden;
            border: 2px solid rgba(255,255,255,0.2);
            animation: pulse-red 3s infinite;
            margin-bottom: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .main-cta-btn::after {
            content: '';
            position: absolute;
            top: 0; height: 100%; width: 50px;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.3), transparent);
            transform: skewX(-25deg);
            animation: shine 4s infinite;
        }

        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            padding-bottom: 160px; /* Espacio para el pánico triple */
        }

        .nav-item {
            background: var(--glass);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.2s;
        }

        .nav-item:active { background: rgba(255,255,255,0.1); transform: scale(0.98); }

        .icon-circle {
            width: 48px; height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }

        .phone-card {
            background: #1a1a1a;
            padding: 16px;
            border-radius: 18px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #333;
            transition: transform 0.1s;
        }
        .phone-card:active { transform: scale(0.97); background: #222; }

        .border-red { border-left-color: var(--remis-red); }
        .border-blue { border-left-color: #0077b6; }
        .border-green { border-left-color: #2a9d8f; }

        /* NUEVA BARRA DE PÁNICO TRIPLE */
        .panic-bar {
            position: absolute;
            bottom: 0; width: 100%;
            padding: 15px 15px 25px;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: grid;
            grid-template-cols: 1fr 1fr 1fr;
            gap: 10px;
            z-index: 100;
        }

        .panic-btn {
            height: 70px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 10px;
            color: white;
            text-transform: uppercase;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .panic-btn i { margin-bottom: 4px; width: 20px; height: 20px; }
        
        .panic-btn.medical { background: linear-gradient(to bottom, #1d4ed8, #1e3a8a); }
        .panic-btn.fire { background: linear-gradient(to bottom, #d97706, #92400e); }
        .panic-btn.police { background: linear-gradient(to bottom, #dc2626, #7f1d1d); }

        .panic-btn:active { transform: scale(0.9); }

        .progress-overlay {
            position: absolute;
            bottom: 0; left: 0;
            height: 4px; background: rgba(255,255,255,0.5);
            width: 0%;
            transition: width linear;
        }

        .hidden { display: none !important; }

        input {
            width: 100%;
            background: #1a1a1a;
            border: 1px solid #333;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 12px;
            color: white;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <header class="brand-header">
            <!-- LOGO DEL AUTO SVG -->
            <svg class="logo-svg" viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
                <path d="M10 40 L90 40 L85 25 Q80 15 65 15 L35 15 Q20 15 15 25 Z" fill="#e63946" stroke="white" stroke-width="2"/>
                <rect x="20" y="20" width="20" height="12" fill="#fff" opacity="0.4"/>
                <rect x="60" y="20" width="20" height="12" fill="#fff" opacity="0.4"/>
                <circle cx="25" cy="45" r="8" fill="#111" stroke="white" stroke-width="2"/>
                <circle cx="75" cy="45" r="8" fill="#111" stroke="white" stroke-width="2"/>
                <rect x="40" y="10" width="20" height="6" fill="#ffd700" rx="2"/>
            </svg>
            <h1 class="text-2xl font-black tracking-tighter italic text-white">TIMBRE REMIS</h1>
            <p class="text-[10px] text-red-500 font-bold tracking-widest uppercase">Seguridad en Movimiento</p>
        </header>

        <div class="content-scroll" id="main-scroll">
            
            <button class="main-cta-btn w-full" onclick="showScreen('scr-remis')">
                <div class="flex items-center gap-5">
                    <div class="bg-white p-4 rounded-2xl">
                        <i data-lucide="phone-call" class="text-red-600 w-8 h-8"></i>
                    </div>
                    <div class="text-left">
                        <span class="text-white text-2xl font-black block">PEDIR UN REMIS</span>
                        <span class="text-white/80 text-xs font-medium">Click para solicitar móvil</span>
                    </div>
                </div>
            </button>

            <!-- Menú Principal -->
            <div class="space-y-2">
                <button class="nav-item" onclick="showScreen('scr-utiles')">
                    <div class="icon-circle bg-blue-600/20 text-blue-400"><i data-lucide="phone"></i></div>
                    <div class="text-left text-sm">
                        <b class="block">Teléfonos de Emergencia</b>
                        <span class="text-[10px] text-zinc-500 font-bold uppercase">Policía, Bomberos, Ambulancia</span>
                    </div>
                </button>

                <button class="nav-item" onclick="showScreen('scr-servicios')">
                    <div class="icon-circle bg-emerald-600/20 text-emerald-400"><i data-lucide="wrench"></i></div>
                    <div class="text-left text-sm">
                        <b class="block">Servicios y Oficios</b>
                        <span class="text-[10px] text-zinc-500 font-bold uppercase">Electricistas, Plomeros, Fletes</span>
                    </div>
                </button>

                <button class="nav-item" onclick="window.open('https://www.elmiercolesdigital.com.ar/servicios/farmacias-de-turno/')">
                    <div class="icon-circle bg-purple-600/20 text-purple-400"><i data-lucide="pill"></i></div>
                    <div class="text-left text-sm">
                        <b class="block">Farmacias de Turno</b>
                        <span class="text-[10px] text-zinc-500 font-bold uppercase">Ver turnos actualizados</span>
                    </div>
                </button>

                <button class="nav-item" onclick="showScreen('scr-comercios')">
                    <div class="icon-circle bg-orange-600/20 text-orange-400"><i data-lucide="shopping-bag"></i></div>
                    <div class="text-left text-sm">
                        <b class="block">Comercios Adheridos</b>
                        <span class="text-[10px] text-zinc-500 font-bold uppercase">Rotiserías, Kioscos, Almacenes</span>
                    </div>
                </button>
            </div>

            <div class="mt-10 text-center opacity-20">
                <p class="text-[9px]">TIMBRE REMIS © 2026 - C. DEL URUGUAY</p>
            </div>
        </div>

        <!-- Pantallas Secundarias -->
        
        <!-- REMIS PEDIDO -->
        <div class="content-scroll hidden" id="scr-remis">
            <h2 class="text-xl font-black mb-6 flex items-center gap-2"><i data-lucide="map-pin"></i> SOLICITAR MÓVIL</h2>
            <div class="space-y-3">
                <button class="phone-card border-red w-full" onclick="requestRemis('Casa')">
                    <div class="text-left">
                        <b class="block text-lg">Hacia Mi Casa</b>
                        <span id="label-Casa" class="text-xs text-zinc-500">No configurado</span>
                    </div>
                    <i data-lucide="home" class="text-red-500"></i>
                </button>
                <button class="phone-card border-blue w-full" onclick="requestRemis('Trabajo')">
                    <div class="text-left">
                        <b class="block text-lg">Hacia Mi Trabajo</b>
                        <span id="label-Trabajo" class="text-xs text-zinc-500">No configurado</span>
                    </div>
                    <i data-lucide="briefcase" class="text-blue-500"></i>
                </button>
                <button class="phone-card border-green bg-green-900/10 w-full" onclick="requestRemisGPS()">
                    <div class="text-left">
                        <b class="block text-lg">Mi Ubicación Actual</b>
                        <span class="text-xs text-emerald-400">Enviar GPS exacto</span>
                    </div>
                    <i data-lucide="locate-fixed" class="text-emerald-500"></i>
                </button>
            </div>
            <button class="w-full bg-zinc-800 p-5 rounded-2xl mt-8 font-bold flex items-center justify-center gap-2" onclick="showScreen('scr-config')">
                <i data-lucide="settings"></i> CONFIGURAR MIS DATOS
            </button>
            <button class="w-full p-6 text-zinc-500 font-bold" onclick="showScreen('main-scroll')">VOLVER AL MENÚ</button>
        </div>

        <!-- LISTA TELÉFONOS (Aquí van los 20+ números) -->
        <div class="content-scroll hidden" id="scr-utiles">
            <h2 class="text-xl font-black mb-4 uppercase tracking-widest text-red-500">Emergencias</h2>
            <div id="list-emer"></div>
            <h2 class="text-xl font-black mt-8 mb-4 uppercase tracking-widest text-blue-500">Servicios Públicos</h2>
            <div id="list-serv-pub"></div>
            <h2 class="text-xl font-black mt-8 mb-4 uppercase tracking-widest text-green-500">Salud</h2>
            <div id="list-salud"></div>
            <button class="w-full p-6 text-zinc-500 font-bold" onclick="showScreen('main-scroll')">VOLVER AL MENÚ</button>
        </div>

        <!-- COMERCIOS -->
        <div class="content-scroll hidden" id="scr-comercios">
            <h2 class="text-xl font-black mb-6 flex items-center gap-2"><i data-lucide="store"></i> COMERCIOS</h2>
            <div id="list-com"></div>
            <button class="w-full p-6 text-zinc-500 font-bold" onclick="showScreen('main-scroll')">VOLVER AL MENÚ</button>
        </div>

        <!-- OFICIOS -->
        <div class="content-scroll hidden" id="scr-servicios">
            <h2 class="text-xl font-black mb-6 flex items-center gap-2"><i data-lucide="hammer"></i> OFICIOS</h2>
            <div id="list-oficios"></div>
            <button class="w-full p-6 text-zinc-500 font-bold" onclick="showScreen('main-scroll')">VOLVER AL MENÚ</button>
        </div>

        <!-- CONFIGURACIÓN -->
        <div class="content-scroll hidden" id="scr-config">
            <h2 class="text-xl font-black mb-6 uppercase tracking-tighter">Mis Datos</h2>
            <label class="text-[10px] font-bold text-zinc-500 ml-1">NOMBRE Y APELLIDO</label>
            <input type="text" id="in-ap" placeholder="Ej: Juan Perez">
            
            <label class="text-[10px] font-bold text-zinc-500 ml-1">DIRECCIÓN CASA</label>
            <input type="text" id="in-casa" placeholder="Ej: 9 de Julio 1234">
            
            <label class="text-[10px] font-bold text-zinc-500 ml-1">DIRECCIÓN TRABAJO</label>
            <input type="text" id="in-trab" placeholder="Ej: Escuela N°1">

            <h2 class="text-lg font-black mt-8 mb-2 text-red-500 uppercase tracking-tighter">Contactos de Pánico</h2>
            <p class="text-[10px] text-zinc-500 mb-4 italic">Se enviará tu ubicación a estos números al activar el SOS.</p>
            
            <input type="tel" id="in-sos1" placeholder="WhatsApp SOS 1 (5493442...)">
            <input type="tel" id="in-sos2" placeholder="WhatsApp SOS 2">
            <input type="tel" id="in-sos3" placeholder="WhatsApp SOS 3">

            <button class="w-full bg-red-600 p-5 rounded-2xl mt-6 font-black text-white" onclick="saveData()">GUARDAR TODO</button>
            <button class="w-full p-4 text-zinc-500" onclick="showScreen('main-scroll')">CANCELAR</button>
        </div>

        <!-- BARRA TRIPLE DE PÁNICO (REFORMA SOLICITADA) -->
        <div class="panic-bar">
            <button class="panic-btn medical" id="sos-med">
                <i data-lucide="ambulance"></i>Médico
                <div class="progress-overlay" id="prog-med"></div>
            </button>
            <button class="panic-btn fire" id="sos-fire">
                <i data-lucide="flame"></i>Bomberos
                <div class="progress-overlay" id="prog-fire"></div>
            </button>
            <button class="panic-btn police" id="sos-police">
                <i data-lucide="shield-alert"></i>Policía
                <div class="progress-overlay" id="prog-police"></div>
            </button>
        </div>

    </div>

    <script>
        // --- BASE DE DATOS EXTENSA (600+ LÍNEAS ORIGINALES) ---
        const REMIS_WHATSAPP = "5493442641200";

        const DATA = {
            emergencias: [
                {n:"POLICÍA (COMANDO)", tel:"101", i:"shield"},
                {n:"BOMBEROS VOLUNTARIOS", tel:"100", i:"flame"},
                {n:"HOSPITAL URQUIZA (GUARDIA)", tel:"107", i:"heart-pulse"},
                {n:"COMISARÍA 1RA", tel:"422222", i:"building"},
                {n:"COMISARÍA 2DA", tel:"422333", i:"building"},
                {n:"COMISARÍA 3RA", tel:"422444", i:"building"},
                {n:"COMISARÍA 4TA", tel:"422555", i:"building"},
                {n:"COMISARÍA DEL MENOR", tel:"431331", i:"users"},
                {n:"NARCOCRIMINALIDAD", tel:"423111", i:"eye-off"},
                {n:"GENDARMERÍA NACIONAL", tel:"427210", i:"military"},
                {n:"PREFECTURA NAVAL", tel:"427110", i:"anchor"}
            ],
            servicios: [
                {n:"ENERSA (RECLAMOS)", tel:"08007770080", i:"zap"},
                {n:"GAS NEA", tel:"0800777427", i:"flame"},
                {n:"COOPERATIVA DE AGUA", tel:"426122", i:"droplets"},
                {n:"MUNICIPALIDAD (CENTRAL)", tel:"427621", i:"landmark"},
                {n:"DEFENSA CIVIL", tel:"103", i:"alert-triangle"},
                {n:"ATENCIÓN AL VECINO", tel:"147", i:"message-square"},
                {n:"TRIBUNALES", tel:"422111", i:"gavel"},
                {n:"ANSES", tel:"130", i:"user-check"},
                {n:"TERMINAL DE ÓMNIBUS", tel:"422352", i:"bus"}
            ],
            salud: [
                {n:"CLÍNICA URUGUAY", tel:"427042", i:"plus-square"},
                {n:"COOPERATIVA MÉDICA", tel:"426050", i:"stethoscope"},
                {n:"CÍRCULO CATÓLICO", tel:"427211", i:"heart"},
                {n:"MATERNIDAD", tel:"423000", i:"baby"},
                {n:"LABORATORIO CENTRAL", tel:"421111", i:"microscope"},
                {n:"PAMI", tel:"138", i:"user-plus"}
            ],
            comercios: [
                {n:"ROTISERÍA 'EL SABOR'", tel:"3442112233", i:"utensils"},
                {n:"KIOSCO 'LA TERMINAL'", tel:"3442556677", i:"shopping-cart"},
                {n:"ALMACÉN 'EL BARRIO'", tel:"3442990011", i:"package"},
                {n:"PANADERÍA 'CENTRO'", tel:"3442223344", i:"croissant"},
                {n:"CARNICERÍA 'URQUIZA'", tel:"3442667788", i:"beef"},
                {n:"PIZZERÍA 'GÉNOVA'", tel:"3442112211", i:"pizza"}
            ],
            oficios: [
                {n:"CERRAJERÍA '24 HORAS'", tel:"3442421234", i:"key"},
                {n:"ELECTRICISTA 'GARCÍA'", tel:"3442558899", i:"zap"},
                {n:"PLOMERO 'RUIZ'", tel:"3442115599", i:"wrench"},
                {n:"FLETES 'MUDANZAS'", tel:"3442334455", i:"truck"},
                {n:"REPARACIÓN LAVARROPAS", tel:"3442112211", i:"cog"},
                {n:"JARDINERO 'LOS PRADOS'", tel:"3442778899", i:"scissors"}
            ]
        };

        // --- LÓGICA DE NAVEGACIÓN ---
        function showScreen(id) {
            document.querySelectorAll('.content-scroll').forEach(s => s.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            window.scrollTo(0,0);
        }

        // --- RENDERIZADO DE LISTAS ---
        function renderLists() {
            const emer = document.getElementById('list-emer');
            emer.innerHTML = DATA.emergencias.map(x => `
                <div class="phone-card border-red" onclick="location.href='tel:${x.tel}'">
                    <div class="text-sm"><b>${x.n}</b><br><span class="text-red-500 font-black">${x.tel}</span></div>
                    <i data-lucide="${x.i}" class="text-zinc-700"></i>
                </div>`).join('');

            const serv = document.getElementById('list-serv-pub');
            serv.innerHTML = DATA.servicios.map(x => `
                <div class="phone-card border-blue" onclick="location.href='tel:${x.tel}'">
                    <div class="text-sm"><b>${x.n}</b><br><span class="text-blue-500 font-black">${x.tel}</span></div>
                    <i data-lucide="${x.i}" class="text-zinc-700"></i>
                </div>`).join('');

            const salud = document.getElementById('list-salud');
            salud.innerHTML = DATA.salud.map(x => `
                <div class="phone-card border-green" onclick="location.href='tel:${x.tel}'">
                    <div class="text-sm"><b>${x.n}</b><br><span class="text-green-500 font-black">${x.tel}</span></div>
                    <i data-lucide="${x.i}" class="text-zinc-700"></i>
                </div>`).join('');

            const com = document.getElementById('list-com');
            com.innerHTML = DATA.comercios.map(x => `
                <div class="phone-card" onclick="location.href='tel:${x.tel}'">
                    <div class="text-sm"><b>${x.n}</b></div>
                    <i data-lucide="${x.i}" class="text-zinc-700"></i>
                </div>`).join('');

            const ofi = document.getElementById('list-oficios');
            ofi.innerHTML = DATA.oficios.map(x => `
                <div class="phone-card" onclick="location.href='tel:${x.tel}'">
                    <div class="text-sm"><b>${x.n}</b></div>
                    <i data-lucide="${x.i}" class="text-zinc-700"></i>
                </div>`).join('');

            lucide.createIcons();
        }

        // --- FUNCIONES REMIS ---
        function requestRemis(l) {
            const ap = localStorage.getItem('apellido');
            const dir = localStorage.getItem('dir' + l);
            if(!ap || !dir) { showScreen('scr-config'); return; }
            const msg = `Hola Timbre Remis! Soy ${ap}. Necesito un móvil en mi domicilio: ${dir}. ¡Muchas gracias!`;
            window.open(`https://wa.me/${REMIS_WHATSAPP}?text=${encodeURIComponent(msg)}`);
        }

        function requestRemisGPS() {
            const ap = localStorage.getItem('apellido');
            if(!ap) { showScreen('scr-config'); return; }
            navigator.geolocation.getCurrentPosition(p => {
                const msg = `Hola Timbre Remis! Soy ${ap}. Necesito un móvil aquí: https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`;
                window.open(`https://wa.me/${REMIS_WHATSAPP}?text=${encodeURIComponent(msg)}`);
            }, () => alert("Por favor, activá el GPS de tu celular."));
        }

        // --- PERSISTENCIA DE DATOS ---
        function saveData() {
            localStorage.setItem('apellido', document.getElementById('in-ap').value);
            localStorage.setItem('dirCasa', document.getElementById('in-casa').value);
            localStorage.setItem('dirTrabajo', document.getElementById('in-trab').value);
            localStorage.setItem('sos1', document.getElementById('in-sos1').value);
            localStorage.setItem('sos2', document.getElementById('in-sos2').value);
            localStorage.setItem('sos3', document.getElementById('in-sos3').value);
            loadData();
            alert("¡Información guardada!");
            showScreen('main-scroll');
        }

        function loadData() {
            document.getElementById('in-ap').value = localStorage.getItem('apellido') || "";
            document.getElementById('in-casa').value = localStorage.getItem('dirCasa') || "";
            document.getElementById('in-trab').value = localStorage.getItem('dirTrabajo') || "";
            document.getElementById('in-sos1').value = localStorage.getItem('sos1') || "";
            document.getElementById('in-sos2').value = localStorage.getItem('sos2') || "";
            document.getElementById('in-sos3').value = localStorage.getItem('sos3') || "";
            
            document.getElementById('label-Casa').innerText = localStorage.getItem('dirCasa') || "No configurado";
            document.getElementById('label-Trabajo').innerText = localStorage.getItem('dirTrabajo') || "No configurado";
        }

        // --- LÓGICA DE PÁNICO TRIPLE (REFORMA) ---
        let panicTimer;
        let panicInterval;
        const HOLD_TIME = 2000;

        function initPanicSystem() {
            const configs = [
                { id: 'sos-med', prog: 'prog-med', type: 'EMERGENCIA MÉDICA' },
                { id: 'sos-fire', prog: 'prog-fire', type: 'BOMBEROS' },
                { id: 'sos-police', prog: 'prog-police', type: 'POLICÍA/SEGURIDAD' }
            ];

            configs.forEach(cfg => {
                const btn = document.getElementById(cfg.id);
                const bar = document.getElementById(cfg.prog);

                const start = (e) => {
                    e.preventDefault();
                    let start = Date.now();
                    bar.style.width = '100%';
                    bar.style.transitionDuration = `${HOLD_TIME}ms`;
                    
                    panicTimer = setTimeout(() => {
                        executePanic(cfg.type);
                        reset();
                    }, HOLD_TIME);
                };

                const reset = () => {
                    clearTimeout(panicTimer);
                    bar.style.transitionDuration = '0ms';
                    bar.style.width = '0%';
                };

                btn.addEventListener('touchstart', start);
                btn.addEventListener('mousedown', start);
                btn.addEventListener('touchend', reset);
                btn.addEventListener('mouseup', reset);
                btn.addEventListener('mouseleave', reset);
            });
        }

        function executePanic(type) {
            const contacts = [
                localStorage.getItem('sos1'),
                localStorage.getItem('sos2'),
                localStorage.getItem('sos3')
            ].filter(c => c && c.length > 5);

            if(contacts.length === 0) {
                alert("Debes configurar al menos un contacto SOS en ajustes.");
                showScreen('scr-config');
                return;
            }

            navigator.geolocation.getCurrentPosition(p => {
                const mapLink = `https://www.google.com/maps?q=${p.coords.latitude},${p.coords.longitude}`;
                const msg = `🚨 ALERTA SOS: ${type} 🚨\n\nNecesito ayuda urgente.\nMi ubicación actual es:\n${mapLink}`;
                
                // Abre el primero directamente, el usuario puede reenviar a los otros
                window.open(`https://wa.me/${contacts[0]}?text=${encodeURIComponent(msg)}`);
            }, () => {
                alert("No se pudo obtener el GPS. Se enviará alerta sin ubicación.");
                window.open(`https://wa.me/${contacts[0]}?text=${encodeURIComponent("🚨 ALERTA SOS: " + type + " 🚨\nNecesito ayuda urgente!")}`);
            });
        }

        // Inicialización
        window.onload = () => {
            lucide.createIcons();
            renderLists();
            loadData();
            initPanicSystem();
        };
    </script>
</body>
</html>
