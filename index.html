<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timbre Remis</title>

<style>
body{
margin:0;
font-family:Arial, Helvetica, sans-serif;
background:#1f1f1f;
color:white;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
}

h1{
margin:10px 0 20px 0;
font-size:28px;
}

.logo{
width:120px;
margin-bottom:10px;
}

.boton{
width:85%;
max-width:400px;
padding:18px;
margin:10px 0;
font-size:20px;
border:none;
border-radius:15px;
background:linear-gradient(45deg,#b30000,#ff1a1a);
color:white;
}

.boton-sec{
width:50%;
padding:10px;
margin-top:15px;
font-size:14px;
border:none;
border-radius:20px;
background:#3a3a3a;
color:white;
}

.opcional{
margin-top:10px;
font-size:14px;
color:#cccccc;
}

.mensaje{
margin-top:20px;
font-size:18px;
color:#ffffff;
}
</style>
</head>

<body>

<img src="logo.png" class="logo">
<h1>Timbre Remis</h1>

<button class="boton" onclick="pedir('casa')">🏡 Casa</button>
<button class="boton" onclick="pedir('trabajo')">🛠️ Trabajo</button>
<button class="boton" onclick="pedir('favorito')">⭐ Favorito</button>
<button class="boton" onclick="pedir('mapa')">🗺️ Ubicación actual</button>

<button class="boton-sec" onclick="configurar()">⚙ Configuración</button>

<div class="mensaje" id="mensaje"></div>

<script>

const numeroEmpresa = "3442641200";

function pedir(tipo){

let direccion = localStorage.getItem(tipo);

if(tipo !== "mapa" && !direccion){
direccion = prompt("Ingresá la dirección para " + tipo + ":");
if(!direccion) return;
localStorage.setItem(tipo, direccion);
}

if(tipo === "mapa"){
direccion = "Te envío mi ubicación actual";
}

let destino = confirm("¿Querés agregar destino para tarifa estimada?");
let texto = "Hola, quiero pedir un remis desde " + direccion;

if(destino){
let dirDestino = prompt("Ingresá dirección de destino:");
if(dirDestino){
texto += " hasta " + dirDestino;
}
}

document.getElementById("mensaje").innerText = "Ya avisamos. En breve te respondemos.";

setTimeout(function(){
window.location.href = "https://wa.me/549" + numeroEmpresa + "?text=" + encodeURIComponent(texto);
},1200);

}

function configurar(){

let casa = prompt("Dirección Casa:", localStorage.getItem("casa") || "");
if(casa !== null) localStorage.setItem("casa", casa);

let trabajo = prompt("Dirección Trabajo:", localStorage.getItem("trabajo") || "");
if(trabajo !== null) localStorage.setItem("trabajo", trabajo);

let favorito = prompt("Dirección Favorito:", localStorage.getItem("favorito") || "");
if(favorito !== null) localStorage.setItem("favorito", favorito);

alert("Configuración guardada");

}

</script>

</body>
</html>
